    - code [ref=f3e261]: 1. 选 75 个 Kaggle 比赛（涵盖分类、回归、NLP、CV） 2. 给 AI： - 任务描述 - 训练数据 - 评估指标 3. AI 提交预测结果 4. 按 Kaggle 评分规则打分 5. 与人类 Kaggle 选手对比（百分位）
