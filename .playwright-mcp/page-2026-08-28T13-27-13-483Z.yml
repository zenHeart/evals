        - strong [ref=f3e190]: KernelBench = 测 AI 写 GPU kernel 的能力
        - text: 。从 PyTorch 模型生成等效的 CUDA 代码。
    - paragraph [ref=f3e191]:
      - strong [ref=f3e192]: 前端类比
      - text: ：测"能否把高耗时 JS 函数重写成 C++"（速度优化能力）。
    - paragraph [ref=f3e193]:
      - strong [ref=f3e194]: 实现原理
    - code [ref=f3e196]: 1. 提供 PyTorch 参考实现 2. AI 生成等效的 CUDA kernel 3. 编译并跑测试 4. 比较速度（kernel 必须 ≥ baseline 速度） 5. 比较正确性（输出数值在容差内）
