        - strong [ref=f3e88]: SWE-Lancer = OpenAI 出品的"接活能力"测试
        - text: 。从 Upwork 拿真实工程任务，测 AI 能否完成。
    - paragraph [ref=f3e89]:
      - strong [ref=f3e90]: 特色
      - text: ：
    - list [ref=f3e91]:
      - listitem [ref=f3e92]: 真实客户付费的外包项目
      - listitem [ref=f3e93]: 任务金额从 $50 到 $32,000
      - listitem [ref=f3e94]: 真实代码、真实需求
    - paragraph [ref=f3e95]:
      - strong [ref=f3e96]: 实现原理
    - code [ref=f3e98]: 1. 从 Upwork 收集真实工程师外包项目 2. 每个项目有： - 客户需求 - 真实代码库 - 验收测试 3. AI 提交代码 4. 跑测试，按通过率计分 5. 价值 = 通过任务的总金额
    - paragraph [ref=f3e99]:
