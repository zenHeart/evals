    - heading "9.9 为什么这 6 个评测重要" [level=2] [ref=f3e386]
    - list [ref=f3e387]:
      - listitem [ref=f3e388]:
        - strong [ref=f3e389]: 从"做题"到"做工程"
        - text: ：MMLU 是"做题"，KernelBench 是"做 GPU 编程"——更接近真实能力。
      - listitem [ref=f3e390]:
        - strong [ref=f3e391]: 衡量经济价值
        - text: ：SWE-Lancer 用美元计价 = AI 替代程序员的实际经济影响。
      - listitem [ref=f3e392]:
        - strong [ref=f3e393]: 安全双刃剑
        - text: ：Cybench 高分 = AI 既是好安全员，也是好黑客。
      - listitem [ref=f3e394]:
        - strong [ref=f3e395]: AGI 进展的真实指标
        - text: ：这 6 个评测比"GPT-4 在 MMLU 多对 1 题"更能反映 AGI 进展。
    - heading "9.10 ⚠️ 5 个常见错误" [level=2] [ref=f3e396]
    - list [ref=f3e397]:
      - listitem [ref=f3e398]:
        - strong [ref=f3e399]: 把 Terminal-Bench 看作"测程序员能力"
        - text: — 它测的是"用命令行完成任务"，不是"写代码"。
      - listitem [ref=f3e400]:
        - strong [ref=f3e401]: 以为 SWE-Lancer 高分 = AI 能替代 $32k 项目的工程师
        - text: — 大项目仍需人类。
      - listitem [ref=f3e402]:
        - strong [ref=f3e403]: 忽视 Cybench 的双刃剑
        - text: — 训练数据可能让模型学会攻击。
      - listitem [ref=f3e404]:
        - strong [ref=f3e405]: KernelBench 简单以为"AI 写 CUDA 慢一点就行"
        - text: — 实际可能 10-100 倍慢。
      - listitem [ref=f3e406]:
        - strong [ref=f3e407]: 把 AppWorld 看作"聊天机器人测试"
        - text: — 它测"跨应用协作"，是真正的 Agent 能力。
