    - heading "9.2 Terminal-Bench — 终端命令的真实操作" [level=2] [ref=f3e24]
    - paragraph [ref=f3e25]:
      - strong [ref=f3e26]: 一句话定义
    - blockquote [ref=f3e27]:
      - paragraph [ref=f3e28]:
        - strong [ref=f3e29]: Terminal-Bench = 测 AI 在真实终端/CLI 环境下完成复杂任务的能力
        - text: （不是写代码，而是操作命令行工具）。
    - paragraph [ref=f3e30]:
      - strong [ref=f3e31]: 前端类比
      - text: ：测"会用 git / npm / docker" 的能力，不是"会写 JavaScript"。
    - paragraph [ref=f3e32]:
      - strong [ref=f3e33]: 真实样例
    - code [ref=f3e35]: "[任务] 在一个 git 仓库中找到 3 个未合并的 PR 数量 [可用工具] bash, find, grep, git, curl [期望] 输出 3 [评分] 执行命令，验证 stdout 是否为 \"3\""
    - paragraph [ref=f3e36]:
      - strong [ref=f3e37]: 实现原理
    - code [ref=f3e39]: 1. 准备 Docker 镜像（含完整开发环境） 2. 模型通过终端执行命令完成任务 3. 验证命令输出或最终文件状态 4. 通过率 = 完成数 / 总数
