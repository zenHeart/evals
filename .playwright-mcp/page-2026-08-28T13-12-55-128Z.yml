    - heading "1.11 ⚠️ 5 个常见错误" [level=2] [ref=f1e230]
    - list [ref=f1e231]:
      - listitem [ref=f1e232]:
        - strong [ref=f1e233]: 把基准当评估
        - text: — 基准是题库,评估是跑分动作 + 报告,两者不是一回事。
      - listitem [ref=f1e234]:
        - strong [ref=f1e235]: 只看分数不看指标
        - text: — accuracy 80% 可能是闭卷答题 80%,要关心指标定义本身。
      - listitem [ref=f1e236]:
        - strong [ref=f1e237]: 忽略样本量
        - text: — 100 题里 80 分 ≈ [70%, 87%],小样本评估不可靠。
      - listitem [ref=f1e238]:
        - strong [ref=f1e239]: 凭一次分数选模型
        - text: — 至少跑 3 个基准交叉看,单榜第一 = 单点优化。
      - listitem [ref=f1e240]:
        - strong [ref=f1e241]: 把刷榜当真
        - text: — 训练数据可能已包含测试题,看到暴增先查 contamination。
