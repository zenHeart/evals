            - strong [ref=f1e93]: 基准 Benchmark
          - cell "一组任务的集合（如 MMLU 包含 14k 多选题）" [ref=f1e94]
          - cell [ref=f1e95]:
            - code [ref=f1e96]: tests/
            - text: 目录
        - row [ref=f1e97]:
          - cell [ref=f1e98]:
            - strong [ref=f1e99]: 指标 Metric
          - cell "怎么打分（accuracy、pass@k、BLEU）" [ref=f1e100]
          - cell [ref=f1e101]:
            - code [ref=f1e102]: expect().toBe()
