          - cell "题目类别覆盖度" [ref=f1e63]
        - row [ref=f1e64]:
          - cell "测试套件" [ref=f1e65]
          - cell "基准（benchmark）" [ref=f1e66]
    - paragraph [ref=f1e67]:
      - strong [ref=f1e68]: 前端类比
      - text: ：LLM 评估 ≈ 单元测试 + E2E + 性能基准三件套，但题目是"自然语言"，评分经常要"另一个 AI 来判"。
    - heading "1.3 评估的 3 个核心目的" [level=2] [ref=f1e69]
    - paragraph [ref=f1e70]:
      - strong [ref=f1e71]: 选型（selection）
    - paragraph [ref=f1e72]: "\"我的产品应该用 GPT-4o、Claude 3.5 还是 Qwen？\""
    - paragraph [ref=f1e73]: → 看同一份数据集上三个模型的得分高低。
    - paragraph [ref=f1e74]:
      - strong [ref=f1e75]: 回归（regression）
    - paragraph [ref=f1e76]: "\"我升级 prompt 或换模型版本后，效果变没变？\""
    - paragraph [ref=f1e77]:
      - text: → 在固定数据集上跑两遍，对比分数。
      - strong [ref=f1e78]: 这就是 CI 里跑 eval 的本质。
    - paragraph [ref=f1e79]:
      - strong [ref=f1e80]: 改进（improvement）
    - paragraph [ref=f1e81]: "\"我的 prompt 改一个字，整体效果提升还是下降？\""
    - paragraph [ref=f1e82]: → A/B 实验或 paired test。
    - heading "1.4 三个容易混淆的概念" [level=2] [ref=f1e83]
    - table [ref=f1e84]:
