          - cell "可维护性" [ref=f1e157]
        - row [ref=f1e158]:
          - cell "指令遵循（IFEval）" [ref=f1e159]
          - cell "创造性" [ref=f1e160]
        - row [ref=f1e161]:
          - cell "多语言（XCOPA）" [ref=f1e162]
          - cell "推理的\"可解释性\"" [ref=f1e163]
        - row [ref=f1e164]:
