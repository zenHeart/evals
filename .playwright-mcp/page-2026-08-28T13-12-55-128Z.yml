    - blockquote [ref=f1e167]:
      - paragraph [ref=f1e168]:
        - text: 一句关键话：
        - strong [ref=f1e169]: 任何评估都只是真实世界的一个投影。
        - text: 投影越接近你的业务，越有用。
    - heading "1.8 实战与陷阱" [level=2] [ref=f1e170]
    - paragraph [ref=f1e171]:
      - strong [ref=f1e172]: 陷阱 1：把测试集当训练集
    - code [ref=f1e174]: 训练数据 ← 测试集 ❌ 评估数据 ← 独立 hold-out ✓
    - paragraph [ref=f1e175]:
      - strong [ref=f1e176]: 陷阱 2：用单一指标决策
    - paragraph [ref=f1e177]: 准确率高 ≠ 用户满意。至少配 2-3 个指标（如 accuracy + 用户偏好 + 延迟）。
    - paragraph [ref=f1e178]:
      - strong [ref=f1e179]: 陷阱 3：忽略置信区间
    - paragraph [ref=f1e180]:
      - text: 4 道题里答对 3 道 = 75%。但置信区间可能是 [30%, 95%]。
      - strong [ref=f1e181]: 少样本评估不可靠
      - text: 。
