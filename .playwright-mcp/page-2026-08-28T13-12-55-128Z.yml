    - paragraph [ref=f1e109]:
      - strong [ref=f1e110]: 关键洞见
      - text: ：基准是题库，指标是规则，评分器是裁判。
      - strong [ref=f1e111]: 指标错了，再多题也白搭。
    - heading "1.5 一个最小可运行的评估（30 行 TypeScript）" [level=2] [ref=f1e112]
    - code [ref=f1e114]: "// eval.ts — 评估\"模型能否正确做加法\" import OpenAI from \"openai\"; const openai = new OpenAI(); // 1. 任务集（dataset） const tasks = [ { input: \"1 + 1\", expected: \"2\" }, { input: \"23 + 45\", expected: \"68\" }, { input: \"100 + 200\", expected: \"300\" }, { input: \"999 + 1\", expected: \"1000\" }, ]; // 2. 评分函数（metric） function exactMatch(output: string, expected: string): number { return output.trim() === expected.trim() ? 1 : 0; } // 3. 评估循环 async function evaluate(model: string) { let correct = 0; for (const task of tasks) { const res = await openai.chat.completions.create({ model, messages: [{ role: \"user\", content: task.input }], }); const output = res.choices[0].message.content ?? \"\"; const score = exactMatch(output, task.expected); correct += score; console.log(`Q: ${task.input} → A: ${output.trim()} | ${score ? \"✓\" : \"✗\"}`); } return correct / tasks.length; } const acc = await evaluate(\"gpt-4o-mini\"); console.log(`\\nAccuracy: ${(acc * 100).toFixed(1)}%`);"
    - paragraph [ref=f1e115]:
      - strong [ref=f1e116]: 运行
      - text: ：
      - code [ref=f1e117]: npx tsx eval.ts
      - text: （或用
      - code [ref=f1e118]: node --experimental-strip-types
      - text: ）
    - paragraph [ref=f1e119]:
      - strong [ref=f1e120]: 输出示例
      - text: ：
    - code [ref=f1e122]: "Q: 1 + 1 → A: 2 | ✓ Q: 23 + 45 → A: 68 | ✓ Q: 100 + 200 → A: 300 | ✓ Q: 999 + 1 → A: 1000 | ✓ Accuracy: 100.0%"
    - paragraph [ref=f1e123]:
      - text: 这就是
      - strong [ref=f1e124]: 完整评估流程的最简版
      - text: ：题目 → 模型 → 评分 → 汇总。
    - heading "1.6 为什么\"刷榜\"是个问题" [level=2] [ref=f1e125]
    - paragraph [ref=f1e126]: 真实案例：某模型在 MMLU 上拿了 90 分，全网沸腾。但后来发现：
    - list [ref=f1e127]:
      - listitem [ref=f1e128]:
        - text: 训练数据里
        - strong [ref=f1e129]: 已经包含了 MMLU 的测试题
        - text: （数据污染 / data contamination）
      - listitem [ref=f1e130]:
        - text: 评估时用了
        - strong [ref=f1e131]: 特殊 prompt
        - text: （CoT、self-consistency）但报告里没写
      - listitem [ref=f1e132]:
        - text: 用了
        - strong [ref=f1e133]: 多次采样取最高分
        - text: （best-of-N cheating）
    - paragraph [ref=f1e134]:
      - strong [ref=f1e135]: 前端类比
      - text: ：单元测试只测你写过的代码覆盖率 = 100%，但上线后还是炸。评估分数高 ≠ 在真实业务上好用。
    - paragraph [ref=f1e136]:
      - strong [ref=f1e137]: 判断刷榜的 3 个信号
      - text: ：
    - list [ref=f1e138]:
      - listitem [ref=f1e139]: 同一基准某模型突然涨 5+ 分 — 查训练数据声明
      - listitem [ref=f1e140]: 厂商技术报告未列出完整 prompt 模板 — 警惕
      - listitem [ref=f1e141]: 排行榜独占前 3 但人类偏好榜单排第 10 — 数据集不代表真实使用
    - heading "1.7 评估的边界与局限" [level=2] [ref=f1e142]
    - table [ref=f1e143]:
      - rowgroup [ref=f1e144]:
