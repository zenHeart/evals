    - heading "1. 什么是评估：从前端工程师视角看 Eval" [level=1] [ref=f1e10]
    - blockquote [ref=f1e11]:
      - paragraph [ref=f1e12]:
        - strong [ref=f1e13]: 如果只读一节
        - text: ：评估 = 用一套
        - strong [ref=f1e14]: 可重复
        - text: 的规则给模型打分。前端类比：单元测试 + E2E + 性能基准，三者合一。
    - heading "1.1 本章目标与读者" [level=2] [ref=f1e15]
    - paragraph [ref=f1e16]: 读完后你能：
    - list [ref=f1e17]:
      - listitem [ref=f1e18]: 用 30 秒向同事解释"评估"是什么
      - listitem [ref=f1e19]:
        - text: 区分
        - strong [ref=f1e20]: 基准（benchmark）
        - text: 、
        - strong [ref=f1e21]: 指标（metric）
        - text: 、
        - strong [ref=f1e22]: 评分器（judge）
        - text: 、
        - strong [ref=f1e23]: 排行榜（leaderboard）
      - listitem [ref=f1e24]: 说出评估的 3 个核心目的：选型、回归、改进
      - listitem [ref=f1e25]: 知道为什么"刷榜"是个严肃问题
    - paragraph [ref=f1e26]:
      - strong [ref=f1e27]: 前置知识
      - text: ：无。如果你写过
      - code [ref=f1e28]: npm test
      - text: 、用过 Lighthouse、看懂 0–100 的分数，本章零负担。
    - heading "1.2 一句话定义" [level=2] [ref=f1e29]
    - blockquote [ref=f1e30]:
      - paragraph [ref=f1e31]:
        - strong [ref=f1e32]: 评估 = 用一组预定义的任务 + 明确的评分规则，让模型输出可比较、可复现的数字。
    - paragraph [ref=f1e33]: 把它拆成三个动作：
    - list [ref=f1e34]:
      - listitem [ref=f1e35]:
        - strong [ref=f1e36]: 任务（task）
        - text: — 出一道题（或多个题）
      - listitem [ref=f1e37]:
        - strong [ref=f1e38]: 生成（inference）
        - text: — 让模型答题
      - listitem [ref=f1e39]:
        - strong [ref=f1e40]: 评分（scoring）
        - text: — 用规则或另一个模型判分
    - paragraph [ref=f1e41]:
      - text: 这和前端写
      - code [ref=f1e42]: expect(add(1, 2)).toBe(3)
      - text: 在结构上
      - strong [ref=f1e43]: 完全一样
      - text: ：
