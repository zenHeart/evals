    - heading "15. LlamaIndex Evaluation" [level=2] [ref=f5e584]
    - heading "15.1 解决什么问题" [level=3] [ref=f5e585]
    - paragraph [ref=f5e586]: LlamaIndex 官方评估工具包，专注 RAG pipeline 评估。
    - heading "15.2 安装" [level=3] [ref=f5e587]
    - code [ref=f5e589]: pip install llama-index llama-index-evaluations
    - heading "15.3 最小示例" [level=3] [ref=f5e590]
    - code [ref=f5e592]: "from llama_index.core.evaluation import FaithfulnessEvaluator from llama_index.core import VectorStoreIndex, SimpleDirectoryReader docs = SimpleDirectoryReader(\"data\").load_data() index = VectorStoreIndex.from_documents(docs) query_engine = index.as_query_engine() eval = FaithfulnessEvaluator() response = query_engine.query(\"公司有几个产品线？\") result = eval.evaluate_response(response=response) print(result.passing) # True/False"
    - heading "15.4 内置指标" [level=3] [ref=f5e593]
    - paragraph [ref=f5e594]:
      - code [ref=f5e595]: FaithfulnessEvaluator
      - text: 、
      - code [ref=f5e596]: RelevancyEvaluator
      - text: 、
      - code [ref=f5e597]: CorrectnessEvaluator
      - text: 、
      - code [ref=f5e598]: GuidelineEvaluator
      - text: 、
      - code [ref=f5e599]: BatchEvalRunner
      - text: （批量）。
    - heading "15.5 厂商集成" [level=3] [ref=f5e600]
    - paragraph [ref=f5e601]: 与 LlamaIndex 兼容的任意 LLM。
