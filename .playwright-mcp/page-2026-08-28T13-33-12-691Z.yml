    - code [ref=f5e653]: "- run: npx promptfoo eval --output results.json - uses: actions/upload-artifact@v4 with: { path: results.json }"
    - heading "16.8 适用" [level=3] [ref=f5e654]
    - paragraph [ref=f5e655]: 前端工程师最友好的 prompt 评估工具，无 Python 依赖。
