    - heading "43.5 部署" [level=3] [ref=f5e1092]
    - paragraph [ref=f5e1093]: 通过 GitHub Pages / Vercel / Cloudflare Pages 静态托管。
    - heading "43.6 适用" [level=3] [ref=f5e1094]
    - paragraph [ref=f5e1095]: PM/leader 想看"哪个模型更稳"，需要可分享的可读报告。
    - separator [ref=f5e1096]
    - heading "第九部分：关键概念" [level=1] [ref=f5e1097]
    - heading "44. LLM-as-Judge" [level=2] [ref=f5e1098]
    - heading "44.1 核心思想" [level=3] [ref=f5e1099]
    - paragraph [ref=f5e1100]: 用"一个强 LLM（judge）"给"另一个 LLM 的输出"打分。代替昂贵的人评。
    - heading "44.2 基础 judge prompt 模板" [level=3] [ref=f5e1101]
    - code [ref=f5e1103]: "你是一个严格的评分员。请按下列规则对 [答案] 打分（1-5）。 评分标准： - 5 = 完全正确且清晰 - 4 = 正确但略冗余 - 3 = 部分正确 - 2 = 主要错误 - 1 = 错误或有害 问题: {{question}} 答案: {{answer}} 参考: {{reference}} 只输出 1-5 之间的整数，不要解释。"
    - heading "44.3 校准" [level=3] [ref=f5e1104]
    - paragraph [ref=f5e1105]:
      - text: 直接打分会偏。
      - strong [ref=f5e1106]: 校准三件套
      - text: ：
    - list [ref=f5e1107]:
      - listitem [ref=f5e1108]:
        - strong [ref=f5e1109]: Reference-based judge
        - text: ：提供 ground truth，让 judge 回答是否一致（避免宽松打分）。
      - listitem [ref=f5e1110]:
        - strong [ref=f5e1111]: Pairwise judge
        - text: ：两个答案选 A/B 而非独立打分。
      - listitem [ref=f5e1112]:
        - strong [ref=f5e1113]: Position bias correction
        - text: ：调换 A/B 位置再跑一次，取平均。
    - heading "44.4 避免位置偏差" [level=3] [ref=f5e1114]
    - code [ref=f5e1116]: "# 原始顺序 prompt_a = \"A: 答案1\\nB: 答案2\\n谁更好？\" # 翻转 prompt_b = \"A: 答案2\\nB: 答案1\\n谁更好？\" # 两次结果取一致投票"
    - heading "44.5 避免长度偏差" [level=3] [ref=f5e1117]
    - paragraph [ref=f5e1118]: 在 judge prompt 中显式加：
    - code [ref=f5e1120]: "\"不要因为答案更长就偏好它，只根据准确性和有用性评分。\""
    - heading "44.6 避免自我偏好" [level=3] [ref=f5e1121]
    - paragraph [ref=f5e1122]:
      - text: GPT-4 倾向给 GPT-4 的输出高分。
      - strong [ref=f5e1123]: 务必用不同家族
      - text: 的 judge（GPT-4 评 Claude / Claude 评 GPT）。
    - heading "44.7 失败模式" [level=3] [ref=f5e1124]
    - list [ref=f5e1125]:
      - listitem [ref=f5e1126]: Hallucination：judge 自己产生幻觉。
      - listitem [ref=f5e1127]: Verbosity bias：长答案高分。
      - listitem [ref=f5e1128]: Position bias：总是选 A。
      - listitem [ref=f5e1129]: Self-enhancement：偏好自己模型的输出。
      - listitem [ref=f5e1130]: Format sensitivity：JSON 格式 < 自然语言。
    - heading "44.8 何时不用 LLM-as-Judge" [level=3] [ref=f5e1131]
    - list [ref=f5e1132]:
      - listitem [ref=f5e1133]: 安全/红队：judge 自身可能不够严格。
      - listitem [ref=f5e1134]: 数学精确题：必须符号验证。
      - listitem [ref=f5e1135]: 极主观题（创作审美）：仅作为人工参考。
    - separator [ref=f5e1136]
    - heading "45. Human Evaluation 设计" [level=2] [ref=f5e1137]
    - heading "45.1 盲评（Blind Eval）" [level=3] [ref=f5e1138]
    - paragraph [ref=f5e1139]:
      - text: 关键：
      - strong [ref=f5e1140]: 不让评估者知道是哪个模型生成的
      - text: 。最简单做法是 A/B 但去掉标签（"A 回答"、"B 回答"）。
    - heading "45.2 ELO 评分" [level=3] [ref=f5e1141]
    - paragraph [ref=f5e1142]: 借鉴国际象棋 Elo：
    - code [ref=f5e1144]: 新分 = 旧分 + K * (实际得分 - 期望得分)
    - paragraph [ref=f5e1145]: 每场"对决"两个模型回答同一题，多名评估者投票，迭代得到 Elo 排名。LMSYS Chatbot Arena 就是这种模式。
    - heading "45.3 Pairwise（成对比较）" [level=3] [ref=f5e1146]
    - paragraph [ref=f5e1147]:
      - text: 评估者只看"两个答案选更好的"，更易做、信号更强。
      - strong [ref=f5e1148]: 比绝对打分稳定 2-3 倍
      - text: （来自多次研究）。
    - heading "45.4 Likert 量表打分" [level=3] [ref=f5e1149]
    - paragraph [ref=f5e1150]: 5/7 分制："5=非常满意 1=非常不满意"。简单但方差大。
    - heading "45.5 评估者一致性" [level=3] [ref=f5e1151]
    - list [ref=f5e1152]:
      - listitem [ref=f5e1153]: Cohen's Kappa（两人一致率）。
      - listitem [ref=f5e1154]: Krippendorff's Alpha（多人、含缺失）。
      - listitem [ref=f5e1155]: ICC（连续分数）。
    - heading "45.6 最小人评工作流" [level=3] [ref=f5e1156]
    - code [ref=f5e1158]: 100 题 × 2 模型 × 3 评估者 = 600 评分对 约 8 小时（每人 200 题/小时）
    - paragraph [ref=f5e1159]: 工具：Argilla、Label Studio、Scale AI。
    - separator [ref=f5e1160]
    - heading "46. 数据集设计" [level=2] [ref=f5e1161]
    - heading "46.1 避免数据污染（Contamination）" [level=3] [ref=f5e1162]
    - paragraph [ref=f5e1163]: 模型可能"在训练时见过测试题"。防护：
    - list [ref=f5e1164]:
      - listitem [ref=f5e1165]:
        - strong [ref=f5e1166]: 新题 / 私有题
        - text: ：用内部工单、知识库题目。
      - listitem [ref=f5e1167]:
        - strong [ref=f5e1168]: Holdout 策略
        - text: ：训练集、验证集、测试集
        - strong [ref=f5e1169]: 永远不重叠
        - text: 。
      - listitem [ref=f5e1170]:
        - strong [ref=f5e1171]: 变体题
        - text: ：改写原题（不换语义），检测是否依然正确。
      - listitem [ref=f5e1172]:
        - strong [ref=f5e1173]: 时间戳检查
        - text: ：题目是 2024-09 之后的事件，模型不太可能训练过。
    - heading "46.2 Hold-out / Test Set Leakage 防护" [level=3] [ref=f5e1174]
    - list [ref=f5e1175]:
      - listitem [ref=f5e1176]: 永远不把测试集反馈到 prompt / few-shot 示例中。
      - listitem [ref=f5e1177]: 多人分版管理：测试集由产品 / 评估负责人持有，不进开发 PR。
      - listitem [ref=f5e1178]:
        - strong [ref=f5e1179]: Data card
        - text: ：每条样本写明"来自哪里、几时、是否公开"。
    - heading "46.3 数据集 schema" [level=3] [ref=f5e1180]
    - code [ref=f5e1182]: "{\"id\": \"q-001\", \"input\": \"...\", \"expected\": \"...\", \"category\": \"qa\", \"source\": \"kb-2024-09\", \"difficulty\": \"easy\", \"tags\": [\"math\", \"chinese\"]}"
    - heading "46.4 大小" [level=3] [ref=f5e1183]
    - list [ref=f5e1184]:
      - listitem [ref=f5e1185]: 研发阶段：30-100 条够用。
      - listitem [ref=f5e1186]: 决策阶段：300+ 条。
      - listitem [ref=f5e1187]: 论文 SOTA：1,000+ 条。
    - heading "46.5 难度分布" [level=3] [ref=f5e1188]
    - paragraph [ref=f5e1189]: 避免"全是简单题"——准备 easy/medium/hard 桶各 30%。
    - heading "46.6 平衡" [level=3] [ref=f5e1190]
    - list [ref=f5e1191]:
      - listitem [ref=f5e1192]: 类别平衡（QA、摘要、改写、抽取、推理等）。
      - listitem [ref=f5e1193]: 正负样本平衡（如果是分类）。
      - listitem [ref=f5e1194]: 长度分布（短问题、长问题）。
    - separator [ref=f5e1195]
    - heading "47. 置信区间与统计显著性" [level=2] [ref=f5e1196]
    - heading "47.1 为什么需要" [level=3] [ref=f5e1197]
    - paragraph [ref=f5e1198]: "\"模型 A 准确率 80.1%，模型 B 准确率 79.5%。\"这是不是显著差异？样本量小时不可信。"
    - heading "47.2 Bootstrap" [level=3] [ref=f5e1199]
    - code [ref=f5e1201]: "import numpy as np def bootstrap_ci(scores, n=10000, alpha=0.05): means = [] for _ in range(n): sample = np.random.choice(scores, size=len(scores), replace=True) means.append(sample.mean()) lo, hi = np.percentile(means, [alpha/2*100, 100-alpha/2*100]) return (lo, hi)"
    - heading "47.3 Paired Bootstrap" [level=3] [ref=f5e1202]
    - paragraph [ref=f5e1203]: 对比同一个样本上两个模型的差异：
    - code [ref=f5e1205]: "def paired_bootstrap_ci(scores_a, scores_b, n=10000): diffs = [] for _ in range(n): idx = np.random.choice(len(scores_a), len(scores_a), replace=True) diffs.append(np.mean(scores_a[idx] - scores_b[idx])) return np.percentile(diffs, [2.5, 97.5])"
    - paragraph [ref=f5e1206]: 如果 CI 不跨 0，则差异显著。
    - heading "47.4 Wilcoxon 符号秩检验" [level=3] [ref=f5e1207]
    - paragraph [ref=f5e1208]: 非参数配对检验，适合分数非正态。
    - code [ref=f5e1210]: "from scipy.stats import wilcoxon wilcoxon(scores_a, scores_b) # p<0.05 ⇒ 显著"
    - heading "47.5 何时用哪个" [level=3] [ref=f5e1211]
    - list [ref=f5e1212]:
      - listitem [ref=f5e1213]: 分数连续、近似正态：paired t-test。
      - listitem [ref=f5e1214]: 分数非正态、有大量 tie：Wilcoxon。
      - listitem [ref=f5e1215]: 报告置信区间：bootstrap（最通用）。
      - listitem [ref=f5e1216]: 报告"胜率"：McNemar's test（分类任务）。
    - separator [ref=f5e1217]
    - heading "48. 鲁棒性评估" [level=2] [ref=f5e1218]
    - heading "48.1 三个维度" [level=3] [ref=f5e1219]
    - list [ref=f5e1220]:
      - listitem [ref=f5e1221]:
        - strong [ref=f5e1222]: Prompt 改写
        - text: ：原题 vs 同义改写。
      - listitem [ref=f5e1223]:
        - strong [ref=f5e1224]: 采样温度
        - text: ：T=0 / T=0.7 / T=1.0 多次跑。
      - listitem [ref=f5e1225]:
        - strong [ref=f5e1226]: 对抗扰动
        - text: ：typo、emoji、提示注入。
    - heading "48.2 Prompt 改写工具" [level=3] [ref=f5e1227]
    - code [ref=f5e1229]: "def rewrite_prompt(q, n=5): variants = [q] for i in range(n): v = openai_chat( model=\"gpt-4o-mini\", prompt=f\"用不同方式重新表达这个问题，保留意思：{q}\" ) variants.append(v) return variants"
    - heading "48.3 采样温度" [level=3] [ref=f5e1230]
    - code [ref=f5e1232]: "for temp in [0.0, 0.5, 0.8, 1.0]: responses = [run(prompt, temperature=temp) for _ in range(5)] print(f\"temp={temp}, mean_score={np.mean(score(responses))}\")"
    - heading "48.4 对抗扰动" [level=3] [ref=f5e1233]
    - list [ref=f5e1234]:
      - listitem [ref=f5e1235]:
        - strong [ref=f5e1236]: CharSwap
        - text: ：随机替换字符。
      - listitem [ref=f5e1237]:
        - strong [ref=f5e1238]: Synonym
        - text: ：同义词替换。
      - listitem [ref=f5e1239]:
        - strong [ref=f5e1240]: TranslateRoundtrip
        - text: ：英→中→英。
    - paragraph [ref=f5e1241]:
      - text: 工具：
      - code [ref=f5e1242]: textattack
      - text: 、
      - code [ref=f5e1243]: OpenBackdoor
      - text: 。
    - heading "48.5 报告" [level=3] [ref=f5e1244]
    - paragraph [ref=f5e1245]:
      - text: 不仅报"平均分"，要报
      - strong [ref=f5e1246]: 平均分 ± 标准差
      - text: 。
    - separator [ref=f5e1247]
    - heading "49. Calibration 评估" [level=2] [ref=f5e1248]
    - heading "49.1 什么是 Calibration" [level=3] [ref=f5e1249]
    - paragraph [ref=f5e1250]: 当模型说"我 80% 确信"，那 80% 应该是真的。
    - heading "49.2 Brier Score" [level=3] [ref=f5e1251]
    - paragraph [ref=f5e1252]: 均方误差形式：
    - code [ref=f5e1254]: Brier = (1/N) * Σ (predicted_prob - actual_outcome)²
    - paragraph [ref=f5e1255]: 范围 0-1，越小越好。
    - heading "49.3 Expected Calibration Error (ECE)" [level=3] [ref=f5e1256]
    - paragraph [ref=f5e1257]: 分桶（bin）算"每桶预测置信度 vs 实际准确率"的平均差。
    - code [ref=f5e1259]: "def ece(probs, labels, n_bins=10): bins = np.linspace(0, 1, n_bins + 1) ece = 0 for lo, hi in zip(bins[:-1], bins[1:]): mask = (probs >= lo) & (probs < hi) if mask.sum() == 0: continue acc = labels[mask].mean() conf = probs[mask].mean() ece += abs(acc - conf) * mask.sum() / len(probs) return ece"
    - heading "49.4 何时关注" [level=3] [ref=f5e1260]
    - list [ref=f5e1261]:
      - listitem [ref=f5e1262]: 多选题（logprobs 可拿）。
      - listitem [ref=f5e1263]: 应用层（高置信拒绝 / 触发人工 review）。
    - heading "49.5 工具" [level=3] [ref=f5e1264]
    - paragraph [ref=f5e1265]: lm-eval-harness、HELM、HuggingFace evaluate 库。
    - separator [ref=f5e1266]
    - heading "第十部分：前端工程师评估工具链入门清单" [level=1] [ref=f5e1267]
    - heading "写在最前面（800 字）" [level=2] [ref=f5e1268]
    - paragraph [ref=f5e1269]:
      - text: 如果你是前端工程师，第一次接触 LLM 评估，最大的误区是觉得"它很复杂，要学 Python，要学 RAGAS，要学 N 个新概念"。
      - strong [ref=f5e1270]: 其实不一定。
      - text: 我用最少的工具也能在 1 小时内跑通一个完整的自定义评估流水线。
    - paragraph [ref=f5e1271]:
      - strong [ref=f5e1272]: 入门 4 步走，零 Python 依赖：
    - heading "第一步（10 分钟）：装工具" [level=3] [ref=f5e1273]
    - code [ref=f5e1275]: mkdir eval-pipeline && cd eval-pipeline npm init -y npm i promptfoo openai zod npm i -D @types/node tsx typescript
    - heading "第二步（20 分钟）：写 eval set" [level=3] [ref=f5e1276]
    - paragraph [ref=f5e1277]:
      - code [ref=f5e1278]: eval-set.jsonl
      - text: ：
    - code [ref=f5e1280]: "{\"input\":\"2+2=?\",\"expected\":\"4\",\"category\":\"math\"} {\"input\":\"HTTP 状态码 404 表示？\",\"expected\":\"Not Found\",\"category\":\"web\"} {\"input\":\"列出三种前端性能指标\",\"expected\":\"LCP\",\"category\":\"perf\"}"
    - heading "第三步（20 分钟）：写配置" [level=3] [ref=f5e1281]
    - paragraph [ref=f5e1282]:
      - code [ref=f5e1283]: promptfooconfig.yaml
      - text: ：
    - code [ref=f5e1285]: "prompts: - \"请回答以下问题：{{input}}\" - \"回答：{{input}}。请用最简短的答案。\" providers: - openai:gpt-4o-mini tests: eval-set.jsonl defaultTest: options: runSerially: true assert: - type: contains value: \"{{expected}}\" - type: llm-rubric value: \"答案简洁且与问题相关\""
    - heading "第四步（10 分钟）：跑 + 接入 CI" [level=3] [ref=f5e1286]
    - paragraph [ref=f5e1287]: 本地：
    - code [ref=f5e1289]: "npx promptfoo eval npx promptfoo view # 浏览器看 report"
    - paragraph [ref=f5e1290]:
      - text: CI（
      - code [ref=f5e1291]: .github/workflows/eval.yml
      - text: ）：
    - code [ref=f5e1293]: "name: LLM Eval on: [pull_request] jobs: eval: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: { node-version: '20' } - run: npm ci - name: Run promptfoo env: OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} run: npx promptfoo eval --output results.json - name: Upload report uses: actions/upload-artifact@v4 with: name: eval-report path: results.json"
    - paragraph [ref=f5e1294]:
      - strong [ref=f5e1295]: 到这里你已经有了一个能用的流水线。
      - text: 接下来要扩展，按这个顺序：
    - list [ref=f5e1296]:
      - listitem [ref=f5e1297]:
        - strong [ref=f5e1298]: 加 Anthropic 对比
        - text: ：
        - code [ref=f5e1299]: providers
        - text: 加一行
        - code [ref=f5e1300]: anthropic:claude-3-5-sonnet-latest
        - text: 即可。
      - listitem [ref=f5e1301]:
        - strong [ref=f5e1302]: 加自定义指标
        - text: ：写 JS provider / assertion，写 G-Eval 风格的 prompt-based score。
      - listitem [ref=f5e1303]:
        - strong [ref=f5e1304]: 数据集变大
        - text: ：从 30 条扩到 300 条，启用 bootstrap CI 报告。
      - listitem [ref=f5e1305]:
        - strong [ref=f5e1306]: 接 RAG
        - text: ：换 RAGAS（Python） 或 TruLens（JS/TS）。
      - listitem [ref=f5e1307]:
        - strong [ref=f5e1308]: 加红队
        - text: ：跑
        - code [ref=f5e1309]: garak
        - text: 或
        - code [ref=f5e1310]: promptfoo redteam
        - text: 。
      - listitem [ref=f5e1311]:
        - strong [ref=f5e1312]: 加可视化报告站
        - text: ：VitePress + actions 写 markdown。
    - heading "常见坑" [level=3] [ref=f5e1313]
    - list [ref=f5e1314]:
      - listitem [ref=f5e1315]:
        - strong [ref=f5e1316]: JSONL 编码
        - text: ：每行结尾不能有逗号，最后一行不能有尾换行。vscode 可装
        - code [ref=f5e1317]: rainbow-csv
        - text: 验证。
      - listitem [ref=f5e1318]:
        - strong [ref=f5e1319]: 温度
        - text: ：T=0 时得分不固定；要做 CI 取 5 次平均。
      - listitem [ref=f5e1320]:
        - strong [ref=f5e1321]: 成本
        - text: ：300 条 × GPT-4o ≈ $5；gpt-4o-mini ≈ $0.05。先用 mini 跑通。
      - listitem [ref=f5e1322]:
        - strong [ref=f5e1323]: 测试集漂移
        - text: ：模型升级后回归分下降是正常的，要写明"baseline 锁定"。
    - heading "何时升级到 Python 生态" [level=3] [ref=f5e1324]
    - list [ref=f5e1325]:
      - listitem [ref=f5e1326]: 需要 lm-eval-harness / OpenCompass 的学术基准 → 装 Python。
      - listitem [ref=f5e1327]: 需要 RAGAS / DeepEval 的 RAG 评估 → Python（这两个最成熟）。
      - listitem [ref=f5e1328]: 已有 Python 后端 → 顺势。
      - listitem [ref=f5e1329]: 只在 Node.js 项目 → Promptfoo + 自写 provider 够用 90% 场景。
    - heading "推荐的最小学习路径（按周）" [level=3] [ref=f5e1330]
    - list [ref=f5e1331]:
      - listitem [ref=f5e1332]:
        - strong [ref=f5e1333]: 第 1 周
        - text: ：用 Promptfoo 把现有 prompt 接 CI。
      - listitem [ref=f5e1334]:
        - strong [ref=f5e1335]: 第 2 周
        - text: ：加 LLM-as-Judge 评估"回答质量"。
      - listitem [ref=f5e1336]:
        - strong [ref=f5e1337]: 第 3 周
        - text: ：建 100 条内部评估集，启用 bootstrap CI。
      - listitem [ref=f5e1338]:
