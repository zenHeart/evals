    - heading "13. LangSmith Evaluation" [level=2] [ref=f5e531]
    - heading "13.1 解决什么问题" [level=3] [ref=f5e532]
    - paragraph [ref=f5e533]: LangChain 官方平台，把 evaluation 和 LangChain/LangGraph 工作流无缝绑定。
    - heading "13.2 核心架构" [level=3] [ref=f5e534]
    - code [ref=f5e536]: Dataset (UI 标注) ↓ Run (目标函数：你的 chain) ↓ Evaluators (内置 + 自定) ↓ Experiments (A/B 对比)
    - heading "13.3 安装" [level=3] [ref=f5e537]
    - code [ref=f5e539]: pip install langsmith export LANGSMITH_API_KEY=...
    - paragraph [ref=f5e540]: 最小示例：
    - code [ref=f5e542]: "from langsmith import evaluate, Client def predict(inputs): return {\"answer\": my_chain.invoke(inputs[\"question\"])} def correctness(run, example): return {\"score\": int(run.outputs[\"answer\"] == example.outputs[\"answer\"])} results = evaluate( predict, data=\"my-dataset\", evaluators=[correctness], experiment_prefix=\"baseline-v1\" )"
    - heading "13.4 内置指标" [level=3] [ref=f5e543]
    - paragraph [ref=f5e544]:
      - code [ref=f5e545]: cot_qa
      - text: 、
      - code [ref=f5e546]: labeled_criteria
      - text: 、
      - code [ref=f5e547]: labeled_score_string
      - text: 、
      - code [ref=f5e548]: embedding_distance
      - text: 、
      - code [ref=f5e549]: exact_match
      - text: 、自定义。
    - heading "13.5 厂商集成" [level=3] [ref=f5e550]
    - paragraph [ref=f5e551]: 任意 LangChain 兼容模型。
    - heading "13.6 CI/CD" [level=3] [ref=f5e552]
    - paragraph [ref=f5e553]: LangSmith 通过 API 上传结果。
    - heading "13.7 适用" [level=3] [ref=f5e554]
    - paragraph [ref=f5e555]: 已经在 LangChain 生态里。
    - heading "13.8 参考" [level=3] [ref=f5e556]
    - list [ref=f5e557]:
