    - heading "7. LightEval（HuggingFace，现代轻量）" [level=2] [ref=f5e305]
    - heading "7.1 解决什么问题" [level=3] [ref=f5e306]
    - paragraph [ref=f5e307]: HuggingFace 在 2024 年推出的现代评估框架，定位是"lm-eval-harness 的现代替代"。
    - heading "7.2 核心架构" [level=3] [ref=f5e308]
    - list [ref=f5e309]:
      - listitem [ref=f5e310]:
        - strong [ref=f5e311]: Pipeline
        - text: ：数据流
      - listitem [ref=f5e312]:
        - strong [ref=f5e313]: Task
        - text: ：Pydantic 强类型
      - listitem [ref=f5e314]:
        - strong [ref=f5e315]: Model
        - text: ：transformers / vLLM / endpoint
      - listitem [ref=f5e316]:
        - strong [ref=f5e317]: Metric
        - text: ：支持多进程并行
    - heading "7.3 安装" [level=3] [ref=f5e318]
    - code [ref=f5e320]: pip install lighteval lighteval accelerate \ --model_args "pretrained=HuggingFaceH4/zephyr-7b-beta" \ --tasks "leaderboard|mmlu|5" \ --output_dir ./results
    - heading "7.4 内置指标" [level=3] [ref=f5e321]
    - paragraph [ref=f5e322]: 覆盖 HuggingFace Open LLM Leaderboard 所有指标（MMLU、ARC、TruthfulQA、HellaSwag、Winogrande、GSM8K）。
    - heading "7.5 厂商集成" [level=3] [ref=f5e323]
    - paragraph [ref=f5e324]:
      - text: 主要 HuggingFace transformers 生态，通过自定义
      - code [ref=f5e325]: Model
      - text: 类可接任意 API。
    - heading "7.6 适用" [level=3] [ref=f5e326]
    - paragraph [ref=f5e327]: HuggingFace 用户首选。
    - heading "7.7 参考" [level=3] [ref=f5e328]
    - list [ref=f5e329]:
      - listitem [ref=f5e330]: 仓库：<https://github.com/huggingface/lighteval>
    - separator [ref=f5e331]
    - heading "8. Inspect AI（UK AISI / Anthropic 推荐）" [level=2] [ref=f5e332]
    - heading "8.1 解决什么问题" [level=3] [ref=f5e333]
    - paragraph [ref=f5e334]:
      - text: 由 UK AI Safety Institute 开发，Anthropic 在 2024 年明确推荐的评估框架。强调
      - strong [ref=f5e335]: 结构化输出、Python 风格、可组合
      - text: 。
    - heading "8.2 核心架构" [level=3] [ref=f5e336]
    - code [ref=f5e338]: "@task def my_task(): return Task( dataset=json_dataset(\"data.jsonl\"), solver=[generate()], scorer=match() )"
    - paragraph [ref=f5e339]:
      - text: 前端类比：像
      - strong [ref=f5e340]: Playwright
      - text: ——
      - code [ref=f5e341]: "@task"
      - text: 是
      - code [ref=f5e342]: test()
      - text: 、
      - code [ref=f5e343]: solver
      - text: 是 page actions、
      - code [ref=f5e344]: scorer
      - text: 是 assertions。
    - heading "8.3 安装" [level=3] [ref=f5e345]
    - code [ref=f5e347]: pip install inspect-ai
    - paragraph [ref=f5e348]: 最小示例：
    - code [ref=f5e350]: "from inspect_ai import task, eval from inspect_ai.dataset import json_dataset from inspect_ai.solver import generate from inspect_ai.scorer import match @task def trivia(): return Task( dataset=json_dataset(\"trivia.jsonl\"), solver=generate(), scorer=match(ignore_case=True) ) eval(trivia(), model=\"openai/gpt-4o-mini\")"
    - heading "8.4 内置指标" [level=3] [ref=f5e351]
    - paragraph [ref=f5e352]:
      - code [ref=f5e353]: match
      - text: 、
      - code [ref=f5e354]: model_graded
      - text: （LLM-as-Judge）、
      - code [ref=f5e355]: choice
      - text: 、
      - code [ref=f5e356]: answer
      - text: 、
      - code [ref=f5e357]: embedding
      - text: （基于 cosine 相似度）、自定 Python 函数。
    - heading "8.5 厂商集成" [level=3] [ref=f5e358]
    - paragraph [ref=f5e359]: 支持 OpenAI、Anthropic、Vertex、HuggingFace、Ollama、vLLM。
    - heading "8.6 数据集格式" [level=3] [ref=f5e360]
    - paragraph [ref=f5e361]: JSONL：
    - code [ref=f5e363]: "{\"input\": \"What is 2+2?\", \"target\": \"4\"} {\"input\": \"Capital of France?\", \"target\": \"Paris\"}"
    - heading "8.7 CI/CD 集成" [level=3] [ref=f5e364]
    - code [ref=f5e366]: inspect eval trivia.py --model openai/gpt-4o-mini --display plain
    - heading "8.8 适用" [level=3] [ref=f5e367]
    - paragraph [ref=f5e368]: Anthropic 风格的结构化评估、安全评估、Agent 评估（与 Inspect AgentEvals 同源）。
    - heading "8.9 参考" [level=3] [ref=f5e369]
    - list [ref=f5e370]:
      - listitem [ref=f5e371]: 仓库：<https://github.com/UKGovernmentBEIS/inspect_ai>
      - listitem [ref=f5e372]: 文档：<https://inspect.aisi.org.uk/>
    - separator [ref=f5e373]
    - heading "第二部分：RAG / 应用层评估" [level=1] [ref=f5e374]
    - paragraph [ref=f5e375]: 下面这些框架聚焦"我的应用做得好不好"，比如 RAG 召回、文案生成质量、对话连贯度。
    - heading "9. RAGAS（RAG 三件套评估）" [level=2] [ref=f5e376]
    - heading "9.1 解决什么问题" [level=3] [ref=f5e377]
    - paragraph [ref=f5e378]: RAGAS 是 RAG 评估的事实标准。提出三件套指标：
    - list [ref=f5e379]:
      - listitem [ref=f5e380]:
        - strong [ref=f5e381]: Faithfulness（忠实度）
        - text: ：回答是否基于检索内容，不幻觉。
      - listitem [ref=f5e382]:
        - strong [ref=f5e383]: Answer Relevancy（回答相关性）
        - text: ：回答是否真的在回答问题。
      - listitem [ref=f5e384]:
        - strong [ref=f5e385]: Context Precision/Recall（上下文精确/召回）
        - text: ：检索质量。
    - heading "9.2 核心架构" [level=3] [ref=f5e386]
    - paragraph [ref=f5e387]:
      - text: 前端类比：像
      - strong [ref=f5e388]: Lighthouse
      - text: 对 RAG 做审计——多维度打分。
    - code [ref=f5e390]: RAG 管道输出 (question, answer, contexts, ground_truth) ↓ RAGAS metrics (4 个 LLM-as-Judge 调用) ↓ 分数 (0~1)
    - heading "9.3 安装与最小示例" [level=3] [ref=f5e391]
    - code [ref=f5e393]: pip install ragas
    - code [ref=f5e395]: "from ragas import evaluate from ragas.metrics import faithfulness, answer_relevancy, context_precision from datasets import Dataset data = Dataset.from_dict({ \"question\": [\"法国的首都是哪里？\"], \"answer\": [\"巴黎\"], \"contexts\": [[\"巴黎是法国的首都，位于塞纳河畔。\"]], \"ground_truth\": [\"巴黎\"] }) result = evaluate(data, metrics=[faithfulness, answer_relevancy, context_precision]) print(result) # {'faithfulness': 1.0, 'answer_relevancy': 0.95, 'context_precision': 1.0}"
    - heading "9.4 内置指标与自定义" [level=3] [ref=f5e396]
    - paragraph [ref=f5e397]:
      - text: 内置：
      - code [ref=f5e398]: faithfulness
      - text: 、
      - code [ref=f5e399]: answer_relevancy
      - text: 、
      - code [ref=f5e400]: context_precision
      - text: 、
      - code [ref=f5e401]: context_recall
      - text: 、
      - code [ref=f5e402]: answer_correctness
      - text: 、
      - code [ref=f5e403]: answer_similarity
      - text: 。
    - paragraph [ref=f5e404]: 自定义指标示例（基于 BLEU）：
    - code [ref=f5e406]: "from ragas.metrics.base import MetricWithLLM class BleuMetric(MetricWithLLM): name = \"bleu\" def _score(self, row): from nltk.translate.bleu_score import sentence_bleu return sentence_bleu([row[\"ground_truth\"].split()], row[\"answer\"].split())"
    - heading "9.5 厂商 API 集成" [level=3] [ref=f5e407]
    - paragraph [ref=f5e408]: 通过 LangChain ChatModel 支持：OpenAI、Anthropic、Qwen、DeepSeek、Ollama 都行。
    - heading "9.6 数据集格式" [level=3] [ref=f5e409]
    - paragraph [ref=f5e410]:
      - text: HuggingFace
      - code [ref=f5e411]: Dataset
      - text: ，需要
      - code [ref=f5e412]: question
      - text: 、
      - code [ref=f5e413]: answer
      - text: 、
      - code [ref=f5e414]: contexts
      - text: 、
      - code [ref=f5e415]: ground_truth
      - text: 四列。
    - heading "9.7 CI/CD 集成" [level=3] [ref=f5e416]
    - code [ref=f5e418]: "- run: | python eval_rag.py --eval-set data/test.jsonl - uses: actions/upload-artifact@v4 with: { name: ragas-report, path: results/ }"
    - heading "9.8 适用场景" [level=3] [ref=f5e419]
    - paragraph [ref=f5e420]: 任何 RAG 应用上线前必跑；Sprint 回顾"切分策略 vs 上周"的对比。
    - heading "9.9 参考" [level=3] [ref=f5e421]
    - list [ref=f5e422]:
      - listitem [ref=f5e423]: 仓库：<https://github.com/explodinggradients/ragas>
      - listitem [ref=f5e424]: 文档：<https://docs.ragas.io/>
    - separator [ref=f5e425]
    - heading "10. DeepEval（测试驱动 LLM 评估）" [level=2] [ref=f5e426]
    - heading "10.1 解决什么问题" [level=3] [ref=f5e427]
    - paragraph [ref=f5e428]:
      - text: DeepEval 把 LLM 评估包装成
      - strong [ref=f5e429]: pytest 风格
      - text: ——可以
      - code [ref=f5e430]: pytest test_chatbot.py
      - text: ，直接跑 LLM 测试。
    - heading "10.2 核心架构" [level=3] [ref=f5e431]
    - code [ref=f5e433]: Metric ├── G-Eval（自由 prompt + 评分规则） ├── Faithfulness / Hallucination ├── Bias / Toxicity ├── Answer Relevancy └── Custom Metric（继承 BaseMetric）
    - heading "10.3 安装" [level=3] [ref=f5e434]
    - code [ref=f5e436]: pip install deepeval deepeval login --api-key=...
    - paragraph [ref=f5e437]: 最小测试：
    - code [ref=f5e439]: "import pytest from deepeval import assert_test from deepeval.test_case import LLMTestCase from deepeval.metrics import AnswerRelevancyMetric def test_chatbot_relevant(): test_case = LLMTestCase( input=\"解释量子纠缠\", actual_output=\"量子纠缠是指两个粒子即使相隔很远也会即时影响彼此...\", expected_output=\"量子纠缠是两个粒子的关联现象\" ) metric = AnswerRelevancyMetric(threshold=0.7) assert_test(test_case, [metric])"
    - paragraph [ref=f5e440]: 跑：
    - code [ref=f5e442]: deepeval test run test_chatbot.py
    - heading "10.4 内置指标" [level=3] [ref=f5e443]
    - paragraph [ref=f5e444]:
      - code [ref=f5e445]: AnswerRelevancyMetric
      - text: 、
      - code [ref=f5e446]: FaithfulnessMetric
      - text: 、
      - code [ref=f5e447]: HallucinationMetric
      - text: 、
      - code [ref=f5e448]: BiasMetric
      - text: 、
      - code [ref=f5e449]: ToxicityMetric
      - text: 、
      - code [ref=f5e450]: GEval
      - text: （自定义 prompt 评分）。
    - heading "10.5 厂商集成" [level=3] [ref=f5e451]
    - paragraph [ref=f5e452]: 支持 20+ provider，OpenAI、Anthropic、Qwen、DeepSeek、Gemini 全覆盖。
    - heading "10.6 数据集格式" [level=3] [ref=f5e453]
    - paragraph [ref=f5e454]: HuggingFace datasets 或 CSV。Confident AI 平台提供 Web UI。
    - heading "10.7 CI/CD" [level=3] [ref=f5e455]
    - code [ref=f5e457]: "- name: DeepEval env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} } run: deepeval test run tests/eval/ --threshold 0.7"
    - heading "10.8 适用" [level=3] [ref=f5e458]
    - paragraph [ref=f5e459]: 喜欢 pytest 的工程师；CI 里跑 LLM 回归。
    - heading "10.9 参考" [level=3] [ref=f5e460]
    - list [ref=f5e461]:
      - listitem [ref=f5e462]: 仓库：<https://github.com/confident-ai/deepeval>
      - listitem [ref=f5e463]: 平台：<https://www.confident-ai.com/>
    - separator [ref=f5e464]
    - heading "11. TruLens（评估 + 可观测性）" [level=2] [ref=f5e465]
    - heading "11.1 解决什么问题" [level=3] [ref=f5e466]
    - paragraph [ref=f5e467]: TruLens 把 LLM 评估和 OpenTelemetry 风格的可观测性合二为一。
    - heading "11.2 核心架构" [level=3] [ref=f5e468]
    - code [ref=f5e470]: Feedback Function（指标） ├── groundedness ├── answer relevance ├── contextual relevance └── moderation + Instrumentation（追踪每条 trace）
    - heading "11.3 安装" [level=3] [ref=f5e471]
    - code [ref=f5e473]: pip install trulens-eval trulens-apps-langchain
    - paragraph [ref=f5e474]: 最小示例：
    - code [ref=f5e476]: "from trulens.core import Tru from trulens.feedback import Groundedness, AnswerRelevance from trulens.apps.langchain import TruChain tru = Tru() grounded = Groundedness(groundedness_provider=openai) relevance = AnswerRelevance(relevance_provider=openai) tru_chain = TruChain(chain, app_id=\"rag-v1\", feedbacks=[grounded, relevance]) with tru_chain: chain.invoke(\"What is RAG?\")"
    - heading "11.4 内置指标" [level=3] [ref=f5e477]
    - paragraph [ref=f5e478]:
      - code [ref=f5e479]: groundedness
      - text: 、
      - code [ref=f5e480]: qa_relevance
      - text: 、
      - code [ref=f5e481]: context_relevance
      - text: 、
      - code [ref=f5e482]: harmfulness
      - text: 、
      - code [ref=f5e483]: summarization
      - text: 、
      - code [ref=f5e484]: custom
      - text: 。
    - heading "11.5 厂商集成" [level=3] [ref=f5e485]
    - paragraph [ref=f5e486]: OpenAI、Anthropic、HuggingFace、本地 LLM 全部支持。
    - heading "11.6 数据集" [level=3] [ref=f5e487]
    - paragraph [ref=f5e488]: 任意 LangChain / LlamaIndex 应用直接接入。
    - heading "11.7 CI/CD" [level=3] [ref=f5e489]
    - paragraph [ref=f5e490]: 提供 TruLens Dashboard 导出 JSON，可接 CI 阈值门禁。
    - heading "11.8 适用" [level=3] [ref=f5e491]
    - paragraph [ref=f5e492]: 需要看"哪个 step 出了问题"的可观测场景。
    - heading "11.9 参考" [level=3] [ref=f5e493]
    - list [ref=f5e494]:
      - listitem [ref=f5e495]: 仓库：<https://github.com/truera/trulens>
      - listitem [ref=f5e496]: 文档：<https://www.trulens.org/>
    - separator [ref=f5e497]
    - heading "12. Phoenix（Arize）" [level=2] [ref=f5e498]
    - heading "12.1 解决什么问题" [level=3] [ref=f5e499]
    - paragraph [ref=f5e500]: Arize 公司的开源可观测 + 评估平台，专注 RAG 与 LLM tracing。
    - heading "12.2 核心架构" [level=3] [ref=f5e501]
    - code [ref=f5e503]: Phoenix Server (本地) ├── OpenInference trace ├── Evaluations (LLM-as-Judge) ├── Retrieval Eval (RAG) └── Drift / Quality Monitoring
    - heading "12.3 安装" [level=3] [ref=f5e504]
    - code [ref=f5e506]: pip install arize-phoenix phoenix serve
    - paragraph [ref=f5e507]: 或 Docker：
    - code [ref=f5e509]: docker run -p 6006:6006 arizephoenix/phoenix:latest
    - heading "12.4 内置指标" [level=3] [ref=f5e510]
    - paragraph [ref=f5e511]:
      - code [ref=f5e512]: hallucination
      - text: 、
      - code [ref=f5e513]: toxicity
      - text: 、
      - code [ref=f5e514]: qarelevance
      - text: 、
      - code [ref=f5e515]: summarization
      - text: 、
      - code [ref=f5e516]: retrieval_relevance
      - text: 、自定义代码评估器。
    - heading "12.5 厂商集成" [level=3] [ref=f5e517]
    - paragraph [ref=f5e518]: 支持 OpenAI、Anthropic、Vertex、Cohere、自定义 HTTP。
    - heading "12.6 数据集" [level=3] [ref=f5e519]
