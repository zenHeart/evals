    - heading "12.8 适用" [level=3] [ref=f5e524]
    - paragraph [ref=f5e525]: 需要本地 dashboard + LLM trace 联动。
    - heading "12.9 参考" [level=3] [ref=f5e526]
    - list [ref=f5e527]:
      - listitem [ref=f5e528]: 仓库：<https://github.com/Arize-ai/phoenix>
      - listitem [ref=f5e529]: 文档：<https://docs.arize.com/phoenix>
