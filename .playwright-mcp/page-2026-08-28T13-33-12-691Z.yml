    - heading "第八部分：轻量自建" [level=1] [ref=f5e1040]
    - paragraph [ref=f5e1041]: 接下来三个章节专门给前端工程师——不依赖 Python 生态。
    - heading "41. Node.js + zod + OpenAI/Anthropic SDK：50 行 mini evaluator" [level=2] [ref=f5e1042]
    - heading "41.1 解决什么问题" [level=3] [ref=f5e1043]
    - paragraph [ref=f5e1044]: "\"我只想快速验证一个 prompt 改了之后是不是变好了，不要学 RAGAS。\" 这就是 mini evaluator 的目标。"
    - heading "41.2 完整可运行示例" [level=3] [ref=f5e1045]
    - code [ref=f5e1047]: "// mini-eval.ts import OpenAI from \"openai\"; import { z } from \"zod\"; import fs from \"node:fs/promises\"; const openai = new OpenAI(); const Anthropic = (await import(\"@anthropic-ai/sdk\")).default; // 1. 定义评估用例 const Case = z.object({ input: z.string(), expected: z.string(), category: z.enum([\"qa\", \"summary\", \"rewrite\"]), }); type Case = z.infer<typeof Case>; // 2. 加载数据集 const cases: Case[] = JSON.parse(await fs.readFile(\"eval-set.jsonl\", \"utf-8\")) .trim().split(\"\\n\").map(l => Case.parse(JSON.parse(l))); // 3. 跑目标 prompt async function run(c: Case) { const res = await openai.chat.completions.create({ model: \"gpt-4o-mini\", messages: [{ role: \"user\", content: c.input }], }); return res.choices[0].message.content ?? \"\"; } // 4. 评分函数（exact match + 关键词包含） function score(out: string, c: Case) { const exp = c.expected.toLowerCase(); return out.toLowerCase().includes(exp) ? 1 : 0; } // 5. 跑全部 let pass = 0; const detail = []; for (const c of cases) { const out = await run(c); const s = score(out, c); pass += s; detail.push({ ...c, output: out, score: s }); } console.log(`pass rate: ${(pass / cases.length * 100).toFixed(1)}%`); await fs.writeFile(\"results.jsonl\", detail.map(JSON.stringify).join(\"\\n\"));"
    - heading "41.3 配套 eval-set.jsonl" [level=3] [ref=f5e1048]
    - code [ref=f5e1050]: "{\"input\":\"2+2等于几？\",\"expected\":\"4\",\"category\":\"qa\"} {\"input\":\"法国的首都？\",\"expected\":\"巴黎\",\"category\":\"qa\"} {\"input\":\"用一句话介绍 transformer\",\"expected\":\"注意力\",\"category\":\"summary\"}"
    - heading "41.4 跑" [level=3] [ref=f5e1051]
    - code [ref=f5e1053]: npx tsx mini-eval.ts
    - heading "41.5 升级方向" [level=3] [ref=f5e1054]
    - list [ref=f5e1055]:
      - listitem [ref=f5e1056]:
        - text: 加 LLM-as-Judge：把
        - code [ref=f5e1057]: score
        - text: 换成调用
        - code [ref=f5e1058]: claude-3-5-sonnet
        - text: 打分。
      - listitem [ref=f5e1059]: 加 bootstrap 置信区间：跑 N 次随机采样算 95% CI。
      - listitem [ref=f5e1060]: 加 GitHub Actions：见下文。
    - heading "41.6 适用" [level=3] [ref=f5e1061]
    - paragraph [ref=f5e1062]: 原型验证、Sprint 回归、prompt A/B。
    - separator [ref=f5e1063]
    - heading "42. 用 TypeScript 写一个 Promptfoo 自定义 Provider" [level=2] [ref=f5e1064]
    - heading "42.1 解决什么问题" [level=3] [ref=f5e1065]
    - paragraph [ref=f5e1066]: Promptfoo 本身支持 HTTP/Python/JS provider，但你想接一个私有内部 LLM API。
    - heading "42.2 写自定义 provider" [level=3] [ref=f5e1067]
    - code [ref=f5e1069]: "// internal-llm.provider.ts import type { ApiProvider, ProviderResponse } from \"promptfoo\"; export default class InternalLLMProvider implements ApiProvider { async callApi(prompt: string): Promise<ProviderResponse> { const res = await fetch(\"https://internal-llm.company/v1/chat\", { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ prompt, max_tokens: 256 }), }); const data = await res.json(); return { output: data.text }; } }"
    - heading "42.3 在 promptfooconfig.yaml 中引用" [level=3] [ref=f5e1070]
    - code [ref=f5e1072]: "providers: - id: file://internal-llm.provider.ts label: Internal-LLM"
    - heading "42.4 跑" [level=3] [ref=f5e1073]
    - code [ref=f5e1075]: npx promptfoo eval
    - heading "42.5 适用" [level=3] [ref=f5e1076]
    - paragraph [ref=f5e1077]: 任何私有 LLM 端点。
    - separator [ref=f5e1078]
    - heading "43. 用 VitePress 写一个评估报告展示站" [level=2] [ref=f5e1079]
    - heading "43.1 解决什么问题" [level=3] [ref=f5e1080]
    - paragraph [ref=f5e1081]:
      - text: 每次跑完 promptfoo/ragas/lm-eval-harness，结果是 JSON/HTML，散落各处。VitePress 给你一个
      - strong [ref=f5e1082]: 统一报告站
      - text: ——可以分享给团队。
    - heading "43.2 项目结构" [level=3] [ref=f5e1083]
    - code [ref=f5e1085]: "eval-reports/ ├── docs/ │ ├── index.md # 首页 │ ├── gpt-4o-mini.md # 各模型独立页 │ ├── qwen.md │ ├── reports/2025-01.md │ └── .vitepress/config.ts └── scripts/ └── generate.ts # 拉取 results.json → 生成 markdown"
    - heading "43.3 generate.ts" [level=3] [ref=f5e1086]
    - code [ref=f5e1088]: "import fs from \"node:fs/promises\"; const results = JSON.parse(await fs.readFile(\"results.json\", \"utf-8\")); for (const model of Object.keys(results)) { const md = `# ${model}\\n\\n${table(results[model])}`; await fs.writeFile(`docs/${slug(model)}.md`, md); }"
    - heading "43.4 VitePress 启动" [level=3] [ref=f5e1089]
