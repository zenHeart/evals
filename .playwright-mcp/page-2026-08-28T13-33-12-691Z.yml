    - heading "16. Promptfoo（prompt 红队 + A/B）" [level=2] [ref=f5e610]
    - heading "16.1 解决什么问题" [level=3] [ref=f5e611]
    - paragraph [ref=f5e612]: Promptfoo 是 prompt 工程师的"瑞士军刀"——支持多 provider 并行、断言（assert）、红队扫描。
    - heading "16.2 核心架构" [level=3] [ref=f5e613]
    - code [ref=f5e615]: promptfooconfig.yaml ├── prompts（多版本 prompt 列表） ├── providers（多个 LLM） ├── tests（每个测试用例） └── assert（断言/评分）
    - paragraph [ref=f5e616]:
      - text: 前端类比：像
      - strong [ref=f5e617]: Jest snapshot
      - text: +
      - strong [ref=f5e618]: OWASP ZAP
      - text: 的结合体。
    - heading "16.3 安装" [level=3] [ref=f5e619]
    - code [ref=f5e621]: "npm install -g promptfoo # 或 npx promptfoo@latest init"
    - paragraph [ref=f5e622]:
      - text: 最小
      - code [ref=f5e623]: promptfooconfig.yaml
      - text: ：
    - code [ref=f5e625]: "prompts: - \"Translate to French: {{text}}\" - \"请把下面翻译成法语: {{text}}\" providers: - openai:gpt-4o-mini - anthropic:claude-3-5-sonnet-latest tests: - vars: { text: \"Hello\" } assert: - type: contains value: \"Bonjour\" - type: llm-rubric value: \"Translation is natural and grammatically correct\""
    - paragraph [ref=f5e626]: 跑：
    - code [ref=f5e628]: "npx promptfoo eval npx promptfoo view # 浏览器看 report"
    - heading "16.4 内置指标" [level=3] [ref=f5e629]
    - paragraph [ref=f5e630]:
      - code [ref=f5e631]: contains
      - text: 、
      - code [ref=f5e632]: equals
      - text: 、
      - code [ref=f5e633]: regex
      - text: 、
      - code [ref=f5e634]: is-json
      - text: 、
      - code [ref=f5e635]: python
      - text: 、
      - code [ref=f5e636]: python-fn
      - text: 、
      - code [ref=f5e637]: javascript
      - text: 、
      - code [ref=f5e638]: llm-rubric
      - text: 、
      - code [ref=f5e639]: model-graded
      - text: 、
      - code [ref=f5e640]: similar
      - text: 、
      - code [ref=f5e641]: answer-relevance
      - text: 、
      - code [ref=f5e642]: context-relevance
      - text: 、
