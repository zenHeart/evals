  - main [ref=f5e9]:
    - heading "2024-2026 年 LLM 评估框架与工具链深度调研" [level=1] [ref=f5e10]
    - blockquote [ref=f5e11]:
      - paragraph [ref=f5e12]: 目标读者：初级前端工程师（JavaScript/TypeScript、Node.js、Python 基础） 调研范围：综合性框架、RAG/应用层评估、Prompt 评估、红队/安全、Agent 评估、代码 SWE 评估、多模态评估、轻量自建、关键概念
    - separator [ref=f5e13]
    - heading "0. 引言：为什么前端工程师也要学 LLM 评估" [level=2] [ref=f5e14]
    - paragraph [ref=f5e15]: 如果你正在做 AI 应用（哪怕只是一个简单的 Chat 界面），很快会遇到两类问题：
    - list [ref=f5e16]:
      - listitem [ref=f5e17]:
        - strong [ref=f5e18]: "\"我的 prompt 改了之后，模型表现真的变好了吗？\""
        - text: —— 不是感觉，而是有数据支撑。
      - listitem [ref=f5e19]:
        - strong [ref=f5e20]: "\"RAG 加了一个新文档切分策略，召回到底有没有提升？\""
        - text: —— 需要 ground truth 复现。
    - paragraph [ref=f5e21]:
      - text: 这两类问题都属于
      - strong [ref=f5e22]: LLM Evaluation（评估）
      - text: 的范畴。它和前端工程师熟悉的
      - strong [ref=f5e23]: 单元测试、E2E 测试、Performance 基准
      - text: 在方法论上是相通的：都有一个
      - strong [ref=f5e24]: "\"输入 → 跑 → 断言/打分 → 报告\""
      - text: 的循环，只是被评估的对象从函数变成了 LLM。
    - paragraph [ref=f5e25]: 本文档会带你系统认识 40+ 个评估框架，并最终给出一份"1 小时上手"的最小流水线搭建教程。
    - separator [ref=f5e26]
    - heading "第一部分：综合性基准测试框架" [level=1] [ref=f5e27]
    - paragraph [ref=f5e28]: 综合性框架用来给"模型本身"打榜，跑的是学术任务（MMLU、GSM8K、HellaSwag 等），目的是横向比较不同模型的综合能力。
    - heading "1. EleutherAI LM Evaluation Harness（学术金标准）" [level=2] [ref=f5e29]
    - heading "1.1 解决什么问题" [level=3] [ref=f5e30]
    - paragraph [ref=f5e31]:
      - text: lm-eval-harness 是行业事实标准，专门用来跑"学术 benchmark"。论文、模型发布时跑分基本都靠它。任何时候你看到
      - code [ref=f5e32]: MMLU 70.5%
      - text: 、
      - code [ref=f5e33]: GSM8K 85.2%
      - text: 这类数字，几乎都来自它。
    - heading "1.2 核心架构（前端类比）" [level=3] [ref=f5e34]
    - list [ref=f5e35]:
      - listitem [ref=f5e36]:
        - strong [ref=f5e37]: Task（任务）
        - text: ：相当于 Jest 的
        - code [ref=f5e38]: describe
        - text: ，每个 benchmark 是一个 Task 文件。
      - listitem [ref=f5e39]:
        - strong [ref=f5e40]: Few-shot samples（少量样本）
        - text: ：相当于测试
        - code [ref=f5e41]: beforeEach
        - text: 的 fixture。
      - listitem [ref=f5e42]:
        - strong [ref=f5e43]: Metric（指标）
        - text: ：相当于
        - code [ref=f5e44]: expect(x).toBe(y)
        - text: ，支持
        - code [ref=f5e45]: exact_match
        - text: 、
        - code [ref=f5e46]: acc
        - text: 、
        - code [ref=f5e47]: bleu
        - text: 、
        - code [ref=f5e48]: perplexity
        - text: 。
      - listitem [ref=f5e49]:
        - strong [ref=f5e50]: Output filter（输出过滤）
        - text: ：从模型 free-form 输出中提取答案的"钩子函数"，类似前端的 data cleaning。
    - code [ref=f5e52]: Task (HellaSwag) ├── fewshot_context (k=5) ├── doc_to_text / doc_to_target ├── generation_function (model call) └── output_filter + metric
    - heading "1.3 安装与最小可运行示例" [level=3] [ref=f5e53]
    - code [ref=f5e55]: "# Python 环境（推荐 3.10+） git clone https://github.com/EleutherAI/lm-evaluation-harness cd lm-evaluation-harness pip install -e ."
    - paragraph [ref=f5e56]: 跑一个最小任务（5-shot MMLU 的一个子集）：
    - code [ref=f5e58]: "# 使用 HuggingFace 上的开源模型 lm_eval --model hf \\ --model_args pretrained=EleutherAI/gpt-neo-125M \\ --tasks hellaswag \\ --num_fewshot 5 \\ --batch_size 8 \\ --limit 50 \\ --output_path ./results"
    - paragraph [ref=f5e59]:
      - text: 跑 50 条
      - code [ref=f5e60]: hellaswag
      - text: 任务用 GPT-Neo 125M，大约 30 秒，结果以 JSON 形式输出到
      - code [ref=f5e61]: results/
      - text: 。
    - heading "1.4 内置指标与自定义" [level=3] [ref=f5e62]
    - paragraph [ref=f5e63]:
      - text: 内置：
      - code [ref=f5e64]: exact_match
      - text: 、
      - code [ref=f5e65]: acc
      - text: 、
      - code [ref=f5e66]: f1
      - text: 、
      - code [ref=f5e67]: bleu
      - text: 、
      - code [ref=f5e68]: rouge
      - text: 、
      - code [ref=f5e69]: mcc
      - text: 、
      - code [ref=f5e70]: perplexity
      - text: 。
    - paragraph [ref=f5e71]:
      - text: 自定义指标的最小示例（
      - code [ref=f5e72]: my_metric.py
      - text: ）：
    - code [ref=f5e74]: "from lm_eval.api.registry import register_metric @register_metric(\"case_insensitive_acc\") def case_insensitive_acc(items): correct = sum(1 for it in items if it[\"pred\"].strip().lower() == it[\"target\"].strip().lower()) return correct / len(items)"
    - heading "1.5 厂商 API 集成" [level=3] [ref=f5e75]
    - paragraph [ref=f5e76]:
      - text: lm-eval-harness 通过
      - code [ref=f5e77]: lm_eval.models
      - text: 支持任意 API。最小 OpenAI provider 写法：
    - code [ref=f5e79]: "# openai_provider.py from lm_eval.models.openai_completions import OpenAICompletionsAPI # 命令行 lm_eval --model openai-completions \\ --model_args model=gpt-4o-mini \\ --tasks mmlu_high_school_biology \\ --num_fewshot 5"
    - paragraph [ref=f5e80]:
      - text: 也支持 Anthropic（
      - code [ref=f5e81]: anthropic_completions
      - text: ）、Google（
      - code [ref=f5e82]: vertex
      - text: ）、本地 Ollama（
      - code [ref=f5e83]: llama-cpp
      - text: ）。DeepSeek / Qwen 走 OpenAI 兼容端点即可。
    - heading "1.6 数据集格式" [level=3] [ref=f5e84]
    - paragraph [ref=f5e85]:
      - text: 每种 Task 用
      - code [ref=f5e86]: yaml
      - text: 文件描述：
    - code [ref=f5e88]: "task: hellaswag dataset_path: hellaswag dataset_name: null output_type: multiple_choice doc_to_text: \"{{ctx}}\" doc_to_target: \"{{label}}\" num_fewshot: 5 metric: acc"
    - paragraph [ref=f5e89]:
      - text: 如果用自己的私有集，指定
      - code [ref=f5e90]: "dataset_path: json"
      - text: 并把数据放到
      - code [ref=f5e91]: lm_eval/datasets/my_task/
      - text: 下，格式是 HuggingFace
      - code [ref=f5e92]: datasets
      - text: 兼容的 JSON/CSV。
    - heading "1.7 CI/CD 集成" [level=3] [ref=f5e93]
    - code [ref=f5e95]: "# .github/workflows/eval.yml name: LLM Eval on: [push, pull_request] jobs: eval: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: { python-version: '3.11' } - run: pip install -e . - name: Run eval env: OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} run: | lm_eval --model openai-completions \\ --model_args model=gpt-4o-mini \\ --tasks mmlu_high_school_biology,gsm8k \\ --batch_size 16 \\ --output_path results.json - name: Upload report uses: actions/upload-artifact@v4 with: name: eval-report path: results.json"
    - heading "1.8 适用场景与限制" [level=3] [ref=f5e96]
    - paragraph [ref=f5e97]:
      - strong [ref=f5e98]: 适用
      - text: ：模型选型、A/B 对比（跑同一个任务对比两个模型）、回归测试。
      - strong [ref=f5e99]: 限制
      - text: ：纯学术导向，不擅长评估生成质量（需要 LLM-as-Judge 扩展）、不支持多轮对话。
    - heading "1.9 参考链接" [level=3] [ref=f5e100]
    - list [ref=f5e101]:
      - listitem [ref=f5e102]: 仓库：<https://github.com/EleutherAI/lm-evaluation-harness>
      - listitem [ref=f5e103]: 论文：<https://arxiv.org/abs/2109.10254>
      - listitem [ref=f5e104]: Leaderboard：<https://huggingface.co/spaces/HuggingFaceH4/open_llm_leaderboard>
    - separator [ref=f5e105]
    - heading "2. OpenCompass（书生·浦语，中文最强）" [level=2] [ref=f5e106]
    - heading "2.1 解决什么问题" [level=3] [ref=f5e107]
    - paragraph [ref=f5e108]:
      - text: OpenCompass（上海 AI 实验室）专门解决
      - strong [ref=f5e109]: 中文 benchmark 覆盖
      - text: 的问题。lm-eval-harness 的很多任务是英文的，OpenCompass 内置了
      - strong [ref=f5e110]: CEval、CMMLU、GAOKAO-Bench、CMRC
      - text: 等高质量中文任务。
    - heading "2.2 核心架构" [level=3] [ref=f5e111]
    - code [ref=f5e113]: Config（YAML 声明式） ↓ Runner（调度器） ├── Model Adapter（统一接口） ├── Dataset Loader └── Evaluator（支持主观 + 客观 + 长文本）
    - paragraph [ref=f5e114]:
      - text: 前端类比：它就像一个
      - strong [ref=f5e115]: Webpack/Vite 配置驱动的测试框架
      - text: ——所有内容都写在
      - code [ref=f5e116]: config/
      - text: 下，命令行只跑
      - code [ref=f5e117]: run.py
      - text: 。
    - heading "2.3 安装与最小示例" [level=3] [ref=f5e118]
    - code [ref=f5e120]: "pip install opencompass # 或从源码 git clone https://github.com/open-compass/opencompass cd opencompass && pip install -e ."
    - paragraph [ref=f5e121]:
      - text: 最小可运行配置文件
      - code [ref=f5e122]: configs/eval_demo.py
      - text: ：
    - code [ref=f5e124]: "from mmengine.config import read_base with read_base(): from .datasets.ceval.ceval_math import ceval_math_datasets from .models.openai.gpt_4o_mini import models as gpt_4o_mini datasets = ceval_math_datasets models = gpt_4o_mini"
    - paragraph [ref=f5e125]: 跑：
    - code [ref=f5e127]: python run.py configs/eval_demo.py --debug
    - heading "2.4 内置指标" [level=3] [ref=f5e128]
    - list [ref=f5e129]:
      - listitem [ref=f5e130]:
        - text: 客观题：
        - code [ref=f5e131]: acc
        - text: 、
        - code [ref=f5e132]: exact_match
      - listitem [ref=f5e133]: 主观题：LLM-as-Judge，支持 GPT-4 / Qwen / DeepSeek 作为 judge
      - listitem [ref=f5e134]:
        - text: 长文本：
        - code [ref=f5e135]: rouge-L
        - text: 、
        - code [ref=f5e136]: BLEU-4
    - heading "2.5 厂商 API 集成" [level=3] [ref=f5e137]
    - paragraph [ref=f5e138]:
      - code [ref=f5e139]: opencompass/models/
      - text: 下有现成 adapter：
    - list [ref=f5e140]:
      - listitem [ref=f5e141]: OpenAI（gpt-4o、gpt-4o-mini、o1）
      - listitem [ref=f5e142]: Anthropic（claude-3-5-sonnet）
      - listitem [ref=f5e143]: Qwen（dashscope）
      - listitem [ref=f5e144]: DeepSeek（OpenAI 兼容）
      - listitem [ref=f5e145]: Ollama / vLLM 本地
    - heading "2.6 数据集格式" [level=3] [ref=f5e146]
    - paragraph [ref=f5e147]: CSV/JSONL 即可：
    - code [ref=f5e149]: "{\"question\": \"9.11 和 9.9 哪个大？\", \"A\": \"9.11\", \"B\": \"9.9\", \"C\": \"相等\", \"D\": \"无法比较\", \"answer\": \"B\"}"
    - paragraph [ref=f5e150]:
      - text: 放在
      - code [ref=f5e151]: data/your_task/
      - text: 下即可。
    - heading "2.7 CI/CD 集成" [level=3] [ref=f5e152]
    - code [ref=f5e154]: "- name: OpenCompass eval run: | python run.py configs/eval_gpt4o_vs_qwen.py \\ --reuse \\ --dump-mode unittest"
    - paragraph [ref=f5e155]:
      - text: 支持
      - code [ref=f5e156]: "--reuse"
      - text: 缓存推理结果，只对评估部分增量跑（节省成本）。
    - heading "2.8 适用场景与限制" [level=3] [ref=f5e157]
    - paragraph [ref=f5e158]:
      - strong [ref=f5e159]: 适用
      - text: ：中文模型评估、垂直行业评测（医疗、法律）、论文 SOTA 报告。
      - strong [ref=f5e160]: 限制
      - text: ：配置文件
      - code [ref=f5e161]: mmengine
      - text: 学习曲线比 lm-eval-harness 略陡。
    - heading "2.9 参考链接" [level=3] [ref=f5e162]
    - list [ref=f5e163]:
      - listitem [ref=f5e164]: 仓库：<https://github.com/open-compass/opencompass>
      - listitem [ref=f5e165]: 文档：<https://opencompass.readthedocs.io/>
      - listitem [ref=f5e166]: Leaderboard：<https://rank.opencompass.org.cn/>
    - separator [ref=f5e167]
    - heading "3. HELM（Stanford CRFM，多指标综合）" [level=2] [ref=f5e168]
    - heading "3.1 解决什么问题" [level=3] [ref=f5e169]
    - paragraph [ref=f5e170]:
      - text: HELM（Holistic Evaluation of Language Models）强调
      - strong [ref=f5e171]: "\"多指标 + 多场景\""
      - text: ，不仅看准确率，还看公平性、偏见、鲁棒性、效率。
    - heading "3.2 核心架构" [level=3] [ref=f5e172]
    - code [ref=f5e174]: Scenario（场景，如"问答"） ├── Adaptation（in-context / finetune） ├── Model（任意） └── Metric Set（accuracy + bias + robustness + efficiency + ...）
    - paragraph [ref=f5e175]:
      - text: 前端类比：它类似
      - strong [ref=f5e176]: Lighthouse
      - text: ——不仅跑分，还给出"最佳实践"打分。
    - heading "3.3 安装与最小示例" [level=3] [ref=f5e177]
    - code [ref=f5e179]: git clone https://github.com/stanford-crfm/helm cd helm && pip install -e .
    - paragraph [ref=f5e180]: 跑一个 QA 任务（Natural Questions）：
    - code [ref=f5e182]: helm-run \ --run-specs run_specs_qa.yaml \ --models_to_run model=gpt2 \ --output-path runs/
    - paragraph [ref=f5e183]:
      - text: 最小
      - code [ref=f5e184]: run_specs_qa.yaml
      - text: ：
    - code [ref=f5e186]: "name: qa-nq scenario: qa dataset_path: nq_open data_path: data/ model: gpt2 model_max_length: 1024"
    - heading "3.4 内置指标" [level=3] [ref=f5e187]
    - list [ref=f5e188]:
      - listitem [ref=f5e189]: Accuracy、EM、F1
      - listitem [ref=f5e190]: Calibration（ECE、Brier Score）
      - listitem [ref=f5e191]: Fairness（demographic parity）
      - listitem [ref=f5e192]: Robustness（typo、paraphrase）
      - listitem [ref=f5e193]: Bias（stereotype score）
      - listitem [ref=f5e194]: Efficiency（FLOPs、carbon）
    - heading "3.5 厂商 API 集成" [level=3] [ref=f5e195]
    - paragraph [ref=f5e196]:
      - text: HELM 原生支持 OpenAI 与 HuggingFace。Anthropic 需通过自定义
      - code [ref=f5e197]: ClientV2
      - text: 适配。
    - heading "3.6 数据集格式" [level=3] [ref=f5e198]
    - paragraph [ref=f5e199]:
      - text: 与 lm-eval-harness 类似的 HuggingFace datasets 风格，外加一个
      - code [ref=f5e200]: tags.yaml
      - text: 描述元信息。
    - heading "3.7 CI/CD 集成" [level=3] [ref=f5e201]
    - paragraph [ref=f5e202]: HELM 输出标准 JSON + HTML 报告，可直接 artifact 上传：
    - code [ref=f5e204]: "- name: HELM eval run: helm-run --run-specs spec.yaml --output-path runs/ - uses: actions/upload-artifact@v4 with: name: helm-report path: runs/"
    - heading "3.8 适用场景与限制" [level=3] [ref=f5e205]
    - paragraph [ref=f5e206]:
      - strong [ref=f5e207]: 适用
      - text: ：论文级别的"负责任评估"、模型对多个维度的能力画像。
      - strong [ref=f5e208]: 限制
      - text: ：命令全大写、不易调试、文档偏学术。
    - heading "3.9 参考链接" [level=3] [ref=f5e209]
    - list [ref=f5e210]:
      - listitem [ref=f5e211]: 仓库：<https://github.com/stanford-crfm/helm>
      - listitem [ref=f5e212]: 论文：<https://arxiv.org/abs/2211.09110>
      - listitem [ref=f5e213]: 主页：<https://crfm.stanford.edu/helm/>
    - separator [ref=f5e214]
    - heading "4. BIG-Bench（Google 2022 大集合）" [level=2] [ref=f5e215]
    - heading "4.1 解决什么问题" [level=3] [ref=f5e216]
    - paragraph [ref=f5e217]:
      - text: BIG-Bench 含
      - strong [ref=f5e218]: 204 个任务
      - text: ，从笑话理解到符号推理，覆盖面极广。BIG-Bench Hard（BBH）是其中 23 个最难任务的子集，常用于测试推理能力。
    - heading "4.2 核心架构" [level=3] [ref=f5e219]
    - paragraph [ref=f5e220]: 每个 task 是一个 Python module：
    - code [ref=f5e222]: "class MyTask(luigi.Task): def output(self): return ... def run(self): ... # 生成 question + target"
    - paragraph [ref=f5e223]:
      - text: 前端类比：像
      - strong [ref=f5e224]: Storybook
      - text: ，每个 story 独立可注册。
    - heading "4.3 安装与最小示例" [level=3] [ref=f5e225]
    - code [ref=f5e227]: git clone https://github.com/google/BIG-bench cd BIG-bench pip install -e .
    - paragraph [ref=f5e228]:
      - text: 通过
      - code [ref=f5e229]: lm-eval-harness
      - text: 间接跑 BIG-Bench 是更现代的方式：
    - code [ref=f5e231]: lm_eval --model openai-completions \ --model_args model=gpt-4o-mini \ --tasks big_bench_hard
    - heading "4.4 内置指标" [level=3] [ref=f5e232]
    - paragraph [ref=f5e233]:
      - code [ref=f5e234]: exact_match
      - text: 、
      - code [ref=f5e235]: acc
      - text: 、
      - code [ref=f5e236]: bleu
      - text: 各 task 自带。
    - heading "4.5 厂商 API 集成" [level=3] [ref=f5e237]
    - paragraph [ref=f5e238]:
      - text: 通过
      - code [ref=f5e239]: lm-eval-harness
      - text: 中转即可。
    - heading "4.6 数据集格式" [level=3] [ref=f5e240]
    - paragraph [ref=f5e241]:
      - text: JSONL，每行
      - code [ref=f5e242]: "{input, target, ...}"
      - text: 。
    - heading "4.7 CI/CD 集成" [level=3] [ref=f5e243]
    - paragraph [ref=f5e244]: 同 lm-eval-harness。
    - heading "4.8 适用场景与限制" [level=3] [ref=f5e245]
    - paragraph [ref=f5e246]:
      - strong [ref=f5e247]: 适用
      - text: ：基础模型广义能力测试、CoT 推理 benchmark。
      - strong [ref=f5e248]: 限制
      - text: ：任务过于分散，单个任务的样本量小（几十到几百），统计显著性弱。
    - heading "4.9 参考链接" [level=3] [ref=f5e249]
    - list [ref=f5e250]:
      - listitem [ref=f5e251]: 仓库：<https://github.com/google/BIG-bench>
      - listitem [ref=f5e252]: BBH 论文：<https://arxiv.org/abs/2210.09261>
    - separator [ref=f5e253]
    - heading "5. OpenAI Evals（官方）" [level=2] [ref=f5e254]
    - heading "5.1 解决什么问题" [level=3] [ref=f5e255]
    - paragraph [ref=f5e256]:
      - text: OpenAI 在 2023 年开源的官方评估框架，强调
      - strong [ref=f5e257]: "\"小数据集 + 高度定制\""
      - text: 。支持 Completion、Embedding、Function Calling。
    - heading "5.2 核心架构" [level=3] [ref=f5e258]
    - code [ref=f5e260]: Eval (registry 注册) ├── dataset ├── completion fn └── grading fn
    - heading "5.3 安装与最小示例" [level=3] [ref=f5e261]
    - code [ref=f5e263]: git clone https://github.com/openai/evals cd evals && pip install -e .
    - paragraph [ref=f5e264]: 跑一个例子：
    - code [ref=f5e266]: oaieval gpt-4o-mini test-match
    - paragraph [ref=f5e267]:
      - text: 写一个自定义 eval（
      - code [ref=f5e268]: evals/registry/evals/my_eval/my_eval.py
      - text: ）：
    - code [ref=f5e270]: "import evals import evals.metrics class MyMatch(evals.Eval): def __init__(self, **kwargs): super().__init__(**kwargs) def run(self, recorder): for sample in self.get_samples(): output = self.completion_fn(sample[\"input\"]) score = int(sample[\"target\"] in output) recorder.add_result(score=score, sample=sample, output=output)"
    - heading "5.4 内置指标" [level=3] [ref=f5e271]
    - paragraph [ref=f5e272]:
      - code [ref=f5e273]: accuracy
      - text: 、
      - code [ref=f5e274]: match
      - text: 、
      - code [ref=f5e275]: includes
      - text: 、
      - code [ref=f5e276]: judged
      - text: （用 GPT-4 当 judge）。
    - heading "5.5 厂商 API 集成" [level=3] [ref=f5e277]
    - paragraph [ref=f5e278]: 仅 OpenAI 官方，但 Completion Function 可自定义，所以理论上也能调其他。
    - heading "5.6 数据集格式" [level=3] [ref=f5e279]
    - paragraph [ref=f5e280]:
      - text: JSONL：
      - code [ref=f5e281]: "{\"input\": \"...\", \"ideal\": \"...\"}"
      - text: 。
    - heading "5.7 CI/CD 集成" [level=3] [ref=f5e282]
    - code [ref=f5e284]: "- name: OpenAI evals env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} } run: oaieval gpt-4o-mini my-eval"
    - heading "5.8 适用场景与限制" [level=3] [ref=f5e285]
    - paragraph [ref=f5e286]:
      - strong [ref=f5e287]: 适用
      - text: ：快速做 OpenAI 模型回归。
      - strong [ref=f5e288]: 限制
      - text: ：维护活跃度低（2023 后更新少）、非 OpenAI 模型需要 hack。
    - heading "5.9 参考链接" [level=3] [ref=f5e289]
    - list [ref=f5e290]:
      - listitem [ref=f5e291]: 仓库：<https://github.com/openai/evals>
    - separator [ref=f5e292]
    - heading "6. BIG-Bench Lite" [level=2] [ref=f5e293]
    - heading "6.1 解决什么问题" [level=3] [ref=f5e294]
    - paragraph [ref=f5e295]: BIG-Bench 的轻量子集（24 个任务），约 30-50 倍计算量减少，论文级"快速跑分"。
    - heading "6.2 安装" [level=3] [ref=f5e296]
    - paragraph [ref=f5e297]:
      - text: 同 BIG-Bench，task name
      - code [ref=f5e298]: big_bench_lite
      - text: 。
    - heading "6.3 适用" [level=3] [ref=f5e299]
    - paragraph [ref=f5e300]: 论文里"we evaluate on BIG-Bench Lite"标准实验。
    - heading "6.4 参考" [level=3] [ref=f5e301]
    - list [ref=f5e302]:
      - listitem [ref=f5e303]: <https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks>
