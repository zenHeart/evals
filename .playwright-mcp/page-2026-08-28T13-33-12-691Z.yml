      - text: 。
    - heading "16.5 厂商集成" [level=3] [ref=f5e646]
    - paragraph [ref=f5e647]: OpenAI、Anthropic、Vertex、Qwen、DeepSeek、Ollama、Mistral、Cohere、HuggingFace、自定义 HTTP/JS/Python。
    - heading "16.6 数据集格式" [level=3] [ref=f5e648]
    - paragraph [ref=f5e649]:
      - text: YAML 或 CSV（
      - code [ref=f5e650]: "tests:"
