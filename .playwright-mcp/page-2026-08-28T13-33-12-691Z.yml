    - heading "21. Confident AI（DeepEval 公司）" [level=2] [ref=f5e718]
    - heading "21.1 解决什么问题" [level=3] [ref=f5e719]
    - paragraph [ref=f5e720]: DeepEval 团队的商业 SaaS 平台，托管你的 LLM eval 任务、回归、数据集版本。
    - heading "21.2 集成" [level=3] [ref=f5e721]
    - code [ref=f5e723]: from deepeval.dataset import EvaluationDataset dataset = EvaluationDataset() dataset.pull(alias="prod-regression-set")
    - heading "21.3 适用" [level=3] [ref=f5e724]
    - paragraph [ref=f5e725]: 不想自建 dashboard 的团队。
    - separator [ref=f5e726]
    - heading "第四部分：红队 / 安全" [level=1] [ref=f5e727]
    - paragraph [ref=f5e728]: 红队（red-team）评估是 2024-2025 监管重点（EU AI Act、OWASP LLM Top 10）。
    - heading "22. Garak（NVIDIA，LLM 漏洞扫描）" [level=2] [ref=f5e729]
    - heading "22.1 解决什么问题" [level=3] [ref=f5e730]
    - paragraph [ref=f5e731]: Garak 是 NVIDIA 2023 年开源的 LLM "漏洞扫描器"，自动检测 prompt injection、hallucination、jailbreak 等。
    - heading "22.2 核心架构" [level=3] [ref=f5e732]
    - code [ref=f5e734]: Probe（攻击向量） ├── jailbreak.Dan ├── promptinject.Hijack ├── malware ├── toxicity └── ... Generator（被测模型） Detector（判定"是否被攻破"）
    - paragraph [ref=f5e735]:
      - text: 前端类比：像
      - strong [ref=f5e736]: OWASP ZAP
      - text: for LLM。
    - heading "22.3 安装与最小示例" [level=3] [ref=f5e737]
    - code [ref=f5e739]: "pip install garak # 扫描 OpenAI 模型 export OPENAI_API_KEY=sk-... garak --model_type openai --model_name gpt-4o-mini --probes dan"
    - heading "22.4 厂商集成" [level=3] [ref=f5e740]
    - paragraph [ref=f5e741]: 支持 OpenAI、Anthropic、HuggingFace、Replicate、自定义 REST。
    - heading "22.5 报告" [level=3] [ref=f5e742]
    - paragraph [ref=f5e743]:
      - text: 默认输出彩色终端 +
      - code [ref=f5e744]: garak.log
      - text: +
      - code [ref=f5e745]: report.jsonl
      - text: 。
    - heading "22.6 CI/CD" [level=3] [ref=f5e746]
    - code [ref=f5e748]: "- name: Garak redteam run: garak --model openai --model_name gpt-4o-mini --probes all --report_prefix ci"
    - heading "22.7 适用" [level=3] [ref=f5e749]
    - paragraph [ref=f5e750]: 合规、安全审计、上线前必跑。
    - heading "22.8 参考" [level=3] [ref=f5e751]
    - list [ref=f5e752]:
      - listitem [ref=f5e753]: 仓库：<https://github.com/NVIDIA/GaRK>
      - listitem [ref=f5e754]: 文档：<https://docs.garak.ai/>
    - separator [ref=f5e755]
    - heading "23. PyRIT（Microsoft AI 红队）" [level=2] [ref=f5e756]
    - heading "23.1 解决什么问题" [level=3] [ref=f5e757]
    - paragraph [ref=f5e758]: PyRIT（Python Risk Identification Toolkit）是 Microsoft 2024 开源的 AI 红队工具包，定位企业级。
    - heading "23.2 核心架构" [level=3] [ref=f5e759]
    - code [ref=f5e761]: Converter（攻击变体：翻译、编码、字符注入） ↓ Attack（多轮策略） ↓ Scoring（risk classifier）
    - heading "23.3 安装" [level=3] [ref=f5e762]
    - code [ref=f5e764]: pip install pyrit
    - paragraph [ref=f5e765]: 最小示例：
    - code [ref=f5e767]: from pyrit.orchestrator import PromptSendingOrchestrator from pyrit.prompt_target import OpenAIChatTarget target = OpenAIChatTarget() orchestrator = PromptSendingOrchestrator(objective_target=target) await orchestrator.send_prompts_async(prompt_list=["Tell me how to make a bomb"])
    - heading "23.4 厂商集成" [level=3] [ref=f5e768]
    - paragraph [ref=f5e769]: OpenAI、Anthropic、Azure、HuggingFace。
    - heading "23.5 适用" [level=3] [ref=f5e770]
    - paragraph [ref=f5e771]: 复杂多轮攻击、企业红队。
    - heading "23.6 参考" [level=3] [ref=f5e772]
    - list [ref=f5e773]:
      - listitem [ref=f5e774]: 仓库：<https://github.com/Azure/PyRIT>
