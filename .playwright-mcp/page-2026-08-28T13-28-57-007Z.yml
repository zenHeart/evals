    - heading "31.2 结课自测（8 题）" [level=2] [ref=f4e22]
    - paragraph [ref=f4e23]:
      - strong [ref=f4e24]: 概念题
      - text: （4 题，每题 5 分）
    - paragraph [ref=f4e25]:
      - strong [ref=f4e26]: 1. 用 30 秒向产品经理解释"评估"是什么。
    - paragraph [ref=f4e27]:
      - strong [ref=f4e28]: 参考答案
      - text: ：
    - blockquote [ref=f4e29]:
      - paragraph [ref=f4e30]: 评估 = 用固定题目 + 规则给模型打分。就像单元测试 + 性能监控 + A/B 实验的结合，目的是回答"这个模型在我业务上好不好用"。
    - paragraph [ref=f4e31]:
      - strong [ref=f4e32]: 2. 评估的 4 步是什么？举例说明。
    - paragraph [ref=f4e33]:
      - strong [ref=f4e34]: 参考答案
      - text: ：
    - list [ref=f4e35]:
      - listitem [ref=f4e36]:
        - strong [ref=f4e37]: 数据集
        - text: （题目）— 准备测试题
      - listitem [ref=f4e38]:
        - strong [ref=f4e39]: 模型推理
        - text: （答题）— 让模型生成答案
      - listitem [ref=f4e40]:
        - strong [ref=f4e41]: 评分
        - text: （判分）— 规则或 LLM Judge
      - listitem [ref=f4e42]:
        - strong [ref=f4e43]: 报告
        - text: （输出）— 聚合 + 错误分析 + 决策
    - paragraph [ref=f4e44]: 例：评估客服 RAG 的"退款问题回答准确性"
    - list [ref=f4e45]:
      - listitem [ref=f4e46]: 准备 200 道退款问题
      - listitem [ref=f4e47]: 让 RAG 系统回答
      - listitem [ref=f4e48]: 用 GPT-4 Judge 打分
      - listitem [ref=f4e49]: 输出报告（按问题类型、看错误样例、给改进建议）
    - paragraph [ref=f4e50]:
      - strong [ref=f4e51]: 3. LLM-as-Judge 的 4 个偏差是什么？如何缓解？
    - paragraph [ref=f4e52]:
      - strong [ref=f4e53]: 参考答案
      - text: ：
    - table [ref=f4e54]:
      - rowgroup [ref=f4e55]:
        - row [ref=f4e56]:
          - columnheader "偏差" [ref=f4e57]
          - columnheader "缓解" [ref=f4e58]
      - rowgroup [ref=f4e59]:
        - row [ref=f4e60]:
          - cell "位置偏差" [ref=f4e61]
          - cell "交换 A/B 位置跑两次" [ref=f4e62]
        - row [ref=f4e63]:
          - cell "长度偏差" [ref=f4e64]
          - cell "截断到相同长度" [ref=f4e65]
        - row [ref=f4e66]:
          - cell "自偏好" [ref=f4e67]
          - cell "用第三方模型（评 GPT-4 用 Claude）" [ref=f4e68]
        - row [ref=f4e69]:
          - cell "格式偏差" [ref=f4e70]
          - cell "用 CoT 评分 + 标准化格式" [ref=f4e71]
    - paragraph [ref=f4e72]:
      - strong [ref=f4e73]: 4. 为什么"刷榜"是严肃问题？
    - paragraph [ref=f4e74]:
      - strong [ref=f4e75]: 参考答案
      - text: ：
    - list [ref=f4e76]:
      - listitem [ref=f4e77]: 训练数据可能包含测试题（数据污染）
      - listitem [ref=f4e78]: 用了特殊 prompt 但报告没写
      - listitem [ref=f4e79]: 用了 best-of-N 取最高分
    - paragraph [ref=f4e80]: → 评估分数高 ≠ 真实业务好
    - paragraph [ref=f4e81]:
      - strong [ref=f4e82]: 实践题
      - text: （4 题，每题 5 分）
    - paragraph [ref=f4e83]:
      - strong [ref=f4e84]: 5. 写一个 30 行的 TypeScript 评估"模型能否正确计算阶乘"。
    - paragraph [ref=f4e85]:
      - strong [ref=f4e86]: 参考答案
      - text: ：
    - code [ref=f4e88]: "import OpenAI from \"openai\"; const openai = new OpenAI(); const tasks = [ { input: \"5! = ?\", expected: \"120\" }, { input: \"10! = ?\", expected: \"3628800\" }, { input: \"0! = ?\", expected: \"1\" }, ]; let correct = 0; for (const t of tasks) { const r = await openai.chat.completions.create({ model: \"gpt-4o-mini\", messages: [{ role: \"user\", content: t.input }], }); const output = r.choices[0].message.content?.trim() ?? \"\"; if (output === t.expected || output.includes(t.expected)) correct++; } console.log(`Accuracy: ${(correct / tasks.length * 100).toFixed(1)}%`);"
    - paragraph [ref=f4e89]:
      - strong [ref=f4e90]: 6. 写一个 RAGAS 评估你 RAG 系统的命令。
    - paragraph [ref=f4e91]:
      - strong [ref=f4e92]: 参考答案
      - text: ：
    - code [ref=f4e94]: "pip install ragas python -c \" from ragas import evaluate from ragas.metrics import faithfulness, answer_relevancy, context_precision, context_recall from datasets import Dataset dataset = Dataset.from_dict({ 'question': [...], 'answer': [...], 'contexts': [...], 'ground_truth': [...], }) result = evaluate(dataset, metrics=[faithfulness, answer_relevancy, context_precision, context_recall]) print(result) \""
    - paragraph [ref=f4e95]:
      - strong [ref=f4e96]: 7. 你的 LLM 客服应用，5 大关键评估指标是什么？
    - paragraph [ref=f4e97]:
      - strong [ref=f4e98]: 参考答案
      - text: ：
    - list [ref=f4e99]:
      - listitem [ref=f4e100]: 意图识别准确率（分类 F1）
      - listitem [ref=f4e101]: 答案忠实性（Faithfulness）
      - listitem [ref=f4e102]: 用户满意度（CSAT）
      - listitem [ref=f4e103]: 响应速度（P95 延迟）
      - listitem [ref=f4e104]: 拒答准确率（边界 case 拒答 / 不拒答）
    - paragraph [ref=f4e105]:
      - strong [ref=f4e106]: 8. 你公司的 AI 产品要从 3 个模型选一个，你会用什么流程？
    - paragraph [ref=f4e107]:
      - strong [ref=f4e108]: 参考答案
      - text: ：
    - code [ref=f4e110]: 1. 拆业务目标为 5 大能力 2. 每个能力设计指标 3. 准备 500 道测试集（公开 20% + 人工 30% + 回流 30% + 合成 20%） 4. 跑 3 个模型 + 报告 5. 看 4 个榜单对账 6. 灰度 5% → 25% → 100% 7. 持续监控 + 每月复盘
    - heading "31.3 FAQ：20 个常见疑问" [level=2] [ref=f4e111]
    - paragraph [ref=f4e112]: "**Q1：评估分数达到多少算\"好\"？"
    - paragraph [ref=f4e113]:
      - strong [ref=f4e114]: A
      - text: ：看具体基准。
    - list [ref=f4e115]:
      - listitem [ref=f4e116]: MMLU > 88% = 顶级
      - listitem [ref=f4e117]: HumanEval > 90% = 顶级
      - listitem [ref=f4e118]: GPQA > 70% = 超过人类博士
      - listitem [ref=f4e119]: Arena Elo > 1250 = 顶级
    - paragraph [ref=f4e120]:
      - text: 但
      - strong [ref=f4e121]: 业务分数 = 你自己的标准
      - text: 。建议 ≥ 90%。
    - paragraph [ref=f4e122]: "**Q2：开源模型 vs 闭源模型怎么选？"
    - paragraph [ref=f4e123]:
      - strong [ref=f4e124]: A
      - text: ：
    - table [ref=f4e125]:
      - rowgroup [ref=f4e126]:
        - row [ref=f4e127]:
          - columnheader "维度" [ref=f4e128]
          - columnheader "开源" [ref=f4e129]
          - columnheader "闭源" [ref=f4e130]
      - rowgroup [ref=f4e131]:
        - row [ref=f4e132]:
          - cell "成本" [ref=f4e133]
          - cell "低（自部署）" [ref=f4e134]
          - cell "中（API 费）" [ref=f4e135]
        - row [ref=f4e136]:
          - cell "性能" [ref=f4e137]
          - cell "中-高" [ref=f4e138]
          - cell "顶" [ref=f4e139]
        - row [ref=f4e140]:
          - cell "隐私" [ref=f4e141]
          - cell "高" [ref=f4e142]
          - cell "中" [ref=f4e143]
        - row [ref=f4e144]:
          - cell "可控" [ref=f4e145]
          - cell "高" [ref=f4e146]
          - cell "低" [ref=f4e147]
        - row [ref=f4e148]:
          - cell "运维" [ref=f4e149]
          - cell "中" [ref=f4e150]
          - cell "低" [ref=f4e151]
    - paragraph [ref=f4e152]: 小规模/隐私敏感 → 开源（Llama 3.1-405B） 大规模/质量优先 → 闭源（GPT-4o、Claude 3.5 Sonnet）
    - paragraph [ref=f4e153]: "**Q3：为什么\"刷榜\"在 LLM 圈这么严重？"
    - paragraph [ref=f4e154]:
      - strong [ref=f4e155]: A
      - text: ：
    - list [ref=f4e156]:
      - listitem [ref=f4e157]: 训练数据动辄 13T token，几乎包含所有公开数据
      - listitem [ref=f4e158]: 测试集小（HumanEval 只有 164 题），容易背
      - listitem [ref=f4e159]: 评估的反馈信号被用作 RLHF 的奖励
    - paragraph [ref=f4e160]: → 厂商有动力优化基准分数。
    - paragraph [ref=f4e161]: "**Q4：可以用 LLM Judge 评估自己吗？"
    - paragraph [ref=f4e162]:
      - strong [ref=f4e163]: A
      - text: ：
      - strong [ref=f4e164]: 不推荐
      - text: 。LLM 评自己有"自偏好"偏差。
      - strong [ref=f4e165]: 用第三方模型
      - text: （如评 GPT-4 用 Claude）。
    - paragraph [ref=f4e166]: "**Q5：评估跑得很慢，怎么办？"
    - paragraph [ref=f4e167]:
      - strong [ref=f4e168]: A
      - text: ：
    - list [ref=f4e169]:
      - listitem [ref=f4e170]:
        - strong [ref=f4e171]: 并行
        - text: ：并发调用 API
      - listitem [ref=f4e172]:
        - strong [ref=f4e173]: 缓存
        - text: ：相同输入不重复
      - listitem [ref=f4e174]:
        - strong [ref=f4e175]: 采样
        - text: ：先跑 10%，稳定后全量
      - listitem [ref=f4e176]:
        - strong [ref=f4e177]: 更小的模型
        - text: ：评估用更小模型（GPT-4o-mini 而不是 GPT-4o）
      - listitem [ref=f4e178]:
        - strong [ref=f4e179]: 分层
        - text: ：PR 跑小集、每日跑全量、发版跑红队
    - paragraph [ref=f4e180]: "**Q6：测试集要多大？"
    - paragraph [ref=f4e181]:
      - strong [ref=f4e182]: A
      - text: ：
    - list [ref=f4e183]:
      - listitem [ref=f4e184]: 简单准确率类：≥ 500 题
      - listitem [ref=f4e185]: 偏好类：≥ 5000 次投票
      - listitem [ref=f4e186]: 开放式：≥ 200 题
    - paragraph [ref=f4e187]:
      - strong [ref=f4e188]: 经验法则
      - text: ：准确率 ±2% 需要 ~ 2500 题。
    - paragraph [ref=f4e189]: "**Q7：人工评估要请多少人？"
    - paragraph [ref=f4e190]:
      - strong [ref=f4e191]: A
      - text: ：
    - list [ref=f4e192]:
      - listitem [ref=f4e193]: 简单分类：≥ 3 人
      - listitem [ref=f4e194]: Likert 评分：≥ 5 人
      - listitem [ref=f4e195]: 复杂判断：≥ 3 人
      - listitem [ref=f4e196]:
        - strong [ref=f4e197]: 每题至少 3 人
        - text: ，Cohen's Kappa ≥ 0.7
    - paragraph [ref=f4e198]: "**Q8：怎么避免数据污染？"
    - paragraph [ref=f4e199]:
      - strong [ref=f4e200]: A
      - text: ：
    - list [ref=f4e201]:
      - listitem [ref=f4e202]:
        - strong [ref=f4e203]: 时间戳
        - text: ：标注数据时间
      - listitem [ref=f4e204]:
        - strong [ref=f4e205]: Hold-out
        - text: ：留 10% 不公开
      - listitem [ref=f4e206]:
        - strong [ref=f4e207]: Canary tokens
        - text: ：插入唯一标记
      - listitem [ref=f4e208]:
        - strong [ref=f4e209]: 问厂商
        - text: ：训练数据是否包含测试集
    - paragraph [ref=f4e210]: "**Q9：开源评估框架怎么选？"
    - paragraph [ref=f4e211]:
      - strong [ref=f4e212]: A
      - text: ：
    - list [ref=f4e213]:
      - listitem [ref=f4e214]: 学术基准：lm-eval-harness
      - listitem [ref=f4e215]: 中文：OpenCompass
      - listitem [ref=f4e216]: 多模态：VLMEvalKit
      - listitem [ref=f4e217]: RAG：RAGAS
      - listitem [ref=f4e218]: Agent：Inspect AI
      - listitem [ref=f4e219]: 红队：Garak
    - paragraph [ref=f4e220]: "**Q10：评估结果不一致怎么办？"
    - paragraph [ref=f4e221]:
      - strong [ref=f4e222]: A
      - text: ：
    - list [ref=f4e223]:
      - listitem [ref=f4e224]: 检查 temperature（应 = 0）
      - listitem [ref=f4e225]: 检查 prompt（应固定）
      - listitem [ref=f4e226]: 检查 API 随机性（换 seed）
      - listitem [ref=f4e227]: 检查数据污染
      - listitem [ref=f4e228]: 检查模型版本
    - paragraph [ref=f4e229]: "**Q11：为什么我的模型在 MMLU 高但用户不满意？"
    - paragraph [ref=f4e230]:
      - strong [ref=f4e231]: A
      - text: ：MMLU 测学科知识，不测对话能力。要看：
    - list [ref=f4e232]:
      - listitem [ref=f4e233]: Arena Elo（真实人类偏好）
      - listitem [ref=f4e234]: MT-Bench（多轮对话）
      - listitem [ref=f4e235]: 你自己的业务 hold-out
    - paragraph [ref=f4e236]: "**Q12：长上下文支持 1M，但 RULER 只测到 32k 怎么办？"
    - paragraph [ref=f4e237]:
      - strong [ref=f4e238]: A
      - text: ：RULER 测的是"有效长上下文"，不是宣称的支持。
      - strong [ref=f4e239]: 以 RULER 实际分数为准
      - text: 。
    - paragraph [ref=f4e240]: "**Q13：怎么测模型是否\"幻觉\"？"
    - paragraph [ref=f4e241]:
      - strong [ref=f4e242]: A
      - text: ：
    - list [ref=f4e243]:
      - listitem [ref=f4e244]: TruthfulQA（事实性）
      - listitem [ref=f4e245]: SimpleQA（短答案事实）
      - listitem [ref=f4e246]: POPE（视觉幻觉）
      - listitem [ref=f4e247]: HaluEval（任务型幻觉）
    - paragraph [ref=f4e248]: "**Q14：多语言怎么测？"
    - paragraph [ref=f4e249]:
      - strong [ref=f4e250]: A
      - text: ：
    - list [ref=f4e251]:
      - listitem [ref=f4e252]: 中文：CMMLU、C-Eval
      - listitem [ref=f4e253]: 多语言：XCOPA、XStoryCloze
      - listitem [ref=f4e254]: 翻译：Flores-200
      - listitem [ref=f4e255]: 多语言 MMLU
    - paragraph [ref=f4e256]: "**Q15：如何选 embedding 模型？"
    - paragraph [ref=f4e257]:
      - strong [ref=f4e258]: A
      - text: ：用
      - strong [ref=f4e259]: MTEB 排行榜
      - text: 。
    - list [ref=f4e260]:
      - listitem [ref=f4e261]: text-embedding-3-large（OpenAI）
      - listitem [ref=f4e262]: bge-large-en-v1.5（BAAI）
      - listitem [ref=f4e263]: m3e-large（Moka）
    - paragraph [ref=f4e264]: "**Q16：评估的\"统计显著性\"是必须的吗？"
    - paragraph [ref=f4e265]:
      - strong [ref=f4e266]: A
      - text: ：
    - list [ref=f4e267]:
      - listitem [ref=f4e268]: 准确率差异 > 2%：不用特别检验
      - listitem [ref=f4e269]: 差异 1-2%：需要显著性检验
      - listitem [ref=f4e270]: 差异 < 1%：基本是噪声
    - paragraph [ref=f4e271]: "**Q17：怎么测模型在 Agent 任务上的能力？"
    - paragraph [ref=f4e272]:
      - strong [ref=f4e273]: A
      - text: ：
    - list [ref=f4e274]:
      - listitem [ref=f4e275]: 简单工具调用：BFCL
      - listitem [ref=f4e276]: 多步推理：AgentBench、GAIA
      - listitem [ref=f4e277]: 真实工程：SWE-bench
      - listitem [ref=f4e278]: 操作系统：OSWorld
    - paragraph [ref=f4e279]: "**Q18：LMSYS Arena 怎么参与？"
    - paragraph [ref=f4e280]:
      - strong [ref=f4e281]: A
      - text: ：
      - link "lmarena.ai" [ref=f4e282] [cursor=pointer]:
        - /url: https://lmarena.ai/
      - text: 直接投票。每个模型需要提交 API。
    - paragraph [ref=f4e283]: "**Q19：评估要不要公开？"
    - paragraph [ref=f4e284]:
      - strong [ref=f4e285]: A
      - text: ：
    - list [ref=f4e286]:
      - listitem [ref=f4e287]: 内部评估：建议公开（建立信任）
      - listitem [ref=f4e288]: 业务评估：建议保密（涉及业务）
      - listitem [ref=f4e289]: 学术评估：必须公开（可复现）
    - paragraph [ref=f4e290]: "**Q20：未来评估的趋势是什么？"
    - paragraph [ref=f4e291]:
      - strong [ref=f4e292]: A
      - text: ：
    - list [ref=f4e293]:
      - listitem [ref=f4e294]:
        - strong [ref=f4e295]: 从静态基准到动态
        - text: （持续更新）
      - listitem [ref=f4e296]:
        - strong [ref=f4e297]: 从单分到多维
        - text: （HELM 风格）
      - listitem [ref=f4e298]:
        - strong [ref=f4e299]: 从离线到在线
        - text: （持续监控）
      - listitem [ref=f4e300]:
        - strong [ref=f4e301]: 从人类到 AI 评 AI
        - text: （LLM-as-Judge + 红队）
      - listitem [ref=f4e302]:
        - strong [ref=f4e303]: 从通用到垂直
        - text: （行业基准）
    - heading "31.4 下一步学习路径" [level=2] [ref=f4e304]
    - paragraph [ref=f4e305]:
      - strong [ref=f4e306]: 第 1 周：
      - text: 跑通基础
    - code [ref=f4e308]: 1. 装 lm-eval-harness 2. 跑 MMLU、GSM8K、HumanEval 3. 读懂报告 4. 复现厂商数字
