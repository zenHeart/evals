      - listitem [ref=f4e352]:
        - strong [ref=f4e353]: "\"业务目标 → 能力 → 指标 → 测试集\""
      - listitem [ref=f4e354]:
        - strong [ref=f4e355]: "\"评估必须集成到 CI/CD\""
      - listitem [ref=f4e356]:
