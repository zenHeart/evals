        - code [ref=f9e141]: "function exactMatch(output: string, expected: string): boolean { return output.trim().toLowerCase() === expected.trim().toLowerCase(); } function numberMatch(output: string, expected: string): boolean { // 容忍格式差异：\"答案是 42\" / \"42\" / \"42.0\" const num = output.match(/-?\\d+\\.?\\d*/)?.[0]; return num === expected; }"
      - paragraph [ref=f9e142]:
        - strong [ref=f9e143]: LLM-as-Judge 评分示例
      - generic [ref=f9e144]:
        - button "复制代码" [ref=f9e145]: 复制
        - code [ref=f9e147]: "const JUDGE_PROMPT = (question: string, answer: string, reference: string) => ` 你是一个严格的评分员。判断模型的回答是否正确。 题目：${question} 参考答案：${reference} 模型回答：${answer} 如果模型回答语义上正确，回答\"正确\"。 如果错误或答非所问，回答\"错误\"。 只回答一个字：正确 / 错误 `; async function llmJudge(question: string, answer: string, reference: string): Promise<boolean> { const res = await openai.chat.completions.create({ model: \"gpt-4o\", messages: [{ role: \"user\", content: JUDGE_PROMPT(question, answer, reference) }], temperature: 0, // 评分要稳定 }); return res.choices[0].message.content?.trim() === \"正确\"; }"
      - heading "3.6 第 4 步：报告" [level=2] [ref=f9e148]
