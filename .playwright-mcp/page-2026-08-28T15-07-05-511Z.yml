        - code [ref=f9e108]: "// 1. 并发控制（避免触发 API 限流） import pLimit from \"p-limit\"; const limit = pLimit(10); // 最多 10 个并发 const results = await Promise.all( tasks.map(task => limit(() => runOneTask(task))) ); // 2. 重试与超时 async function callModelWithRetry(input: string, retries = 3) { for (let i = 0; i < retries; i++) { try { return await Promise.race([ openai.chat.completions.create({...}), new Promise((_, reject) => setTimeout(() => reject(new Error(\"timeout\")), 30000)) ]); } catch (e) { if (i === retries - 1) throw e; await new Promise(r => setTimeout(r, 1000 * (i + 1))); // 指数退避 } } } // 3. 缓存（省钱） import { LRUCache } from \"lru-cache\"; const cache = new LRUCache<string, string>({ max: 10000 });"
