        - code [ref=f10e182]: "function exactMatch(output: string, expected: string): boolean { return output.trim().toLowerCase() === expected.trim().toLowerCase(); } function numberMatch(output: string, expected: string): boolean { // 容忍格式差异：\"答案是 42\" / \"42\" / \"42.0\" const num = output.match(/-?\\d+\\.?\\d*/)?.[0]; return num === expected; }"
      - paragraph [ref=f10e183]:
        - strong [ref=f10e184]: LLM-as-Judge 评分示例
      - generic [ref=f10e185]:
        - button "复制代码" [ref=f10e186] [cursor=pointer]: 复制
        - code [ref=f10e188]: "const JUDGE_PROMPT = (question: string, answer: string, reference: string) => ` 你是一个严格的评分员。判断模型的回答是否正确。 题目：${question} 参考答案：${reference} 模型回答：${answer} 如果模型回答语义上正确，回答\"正确\"。 如果错误或答非所问，回答\"错误\"。 只回答一个字：正确 / 错误 `; async function llmJudge(question: string, answer: string, reference: string): Promise<boolean> { const res = await openai.chat.completions.create({ model: \"gpt-4o\", messages: [{ role: \"user\", content: JUDGE_PROMPT(question, answer, reference) }], temperature: 0, // 评分要稳定 }); return res.choices[0].message.content?.trim() === \"正确\"; }"
      - heading "3.6 第 4 步：报告" [level=2] [ref=f10e189]
