        - text: （Wilson Score Interval，简化版）：
      - generic [ref=f10e204]:
        - button "复制代码" [ref=f10e205] [cursor=pointer]: 复制
        - code [ref=f10e207]: "function wilsonInterval(p: number, n: number, z = 1.96): [number, number] { const denom = 1 + (z * z) / n; const center = (p + (z * z) / (2 * n)) / denom; const margin = (z * Math.sqrt(p * (1 - p) / n + (z * z) / (4 * n * n))) / denom; return [center - margin, center + margin]; }"
      - heading "3.7 完整流程代码（TypeScript）" [level=2] [ref=f10e208]
      - generic [ref=f10e209]:
        - button "复制代码" [ref=f10e210] [cursor=pointer]: 复制
        - code [ref=f10e212]: "import OpenAI from \"openai\"; import fs from \"node:fs\"; import pLimit from \"p-limit\"; const openai = new OpenAI(); const MODEL = \"gpt-4o-mini\"; interface Task { id: string; input: string; expected: string; category: string; } interface Result { id: string; input: string; output: string; expected: string; correct: boolean; category: string; } async function runOne(task: Task): Promise<Result> { const res = await openai.chat.completions.create({ model: MODEL, messages: [{ role: \"user\", content: task.input }], }); const output = res.choices[0].message.content ?? \"\"; const correct = output.trim() === task.expected; return { ...task, output, correct }; } async function main() { // 1. 加载数据集 const tasks: Task[] = fs.readFileSync(\"eval-data.jsonl\", \"utf-8\") .trim().split(\"\\n\").map(l => JSON.parse(l)); console.log(`Loaded ${tasks.length} tasks`); // 2. 模型推理（并发 5） const limit = pLimit(5); const results = await Promise.all(tasks.map(t => limit(() => runOne(t)))); // 3. 评分（已并入 step 2） // 4. 报告 const total = results.length; const correct = results.filter(r => r.correct).length; const acc = correct / total; const byCategory = results.reduce((acc, r) => { acc[r.category] ??= { total: 0, correct: 0 }; acc[r.category].total++; if (r.correct) acc[r.category].correct++; return acc; }, {} as Record<string, { total: number; correct: number }>); console.log(`\\n=== Eval Report ===`); console.log(`Model: ${MODEL}`); console.log(`Total: ${total}, Correct: ${correct}, Accuracy: ${(acc * 100).toFixed(1)}%`); console.log(`\\nBy category:`); for (const [cat, s] of Object.entries(byCategory)) { console.log(` ${cat}: ${(s.correct / s.total * 100).toFixed(1)}% (${s.correct}/${s.total})`); } // 保存原始结果 fs.writeFileSync(\"eval-results.jsonl\", results.map(r => JSON.stringify(r)).join(\"\\n\")); } main().catch(console.error);"
