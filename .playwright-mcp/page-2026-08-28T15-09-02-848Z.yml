      - heading "3.8 实战与陷阱" [level=2] [ref=f10e216]
      - paragraph [ref=f10e217]:
        - strong [ref=f10e218]: 陷阱 1：推理结果未缓存
      - paragraph [ref=f10e219]:
        - text: 跑了 1000 题，重跑一次 = 浪费 $50。
        - strong [ref=f10e220]: 所有推理结果必须缓存到本地 JSONL
        - text: 。
      - paragraph [ref=f10e221]:
        - strong [ref=f10e222]: 陷阱 2：评分时改了 prompt
      - paragraph [ref=f10e223]: 模型 A 用 prompt X 推理，模型 B 用 prompt Y 推理 → 分数不可比。
      - paragraph [ref=f10e224]:
        - strong [ref=f10e225]: 对策
        - text: ：所有模型用同一 prompt 模板。
      - paragraph [ref=f10e226]:
        - strong [ref=f10e227]: 陷阱 3：忽视温度参数
      - paragraph [ref=f10e228]:
        - text: 温度 0 = 稳定，温度 1.0 = 随机波动。
        - strong [ref=f10e229]: 评估必须固定 temperature=0
        - text: （除非测的就是鲁棒性）。
      - paragraph [ref=f10e230]:
        - strong [ref=f10e231]: 陷阱 4：没看错误样例
      - paragraph [ref=f10e232]: 只看总分 = 错的只看数字。一句"模型在长数学题上失败"比"准确率 72%"信息量大 10 倍。
