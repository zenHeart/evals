      - strong [ref=f2e1189]: 规模与样例
      - text: ：817 题。
    - blockquote [ref=f2e1190]:
      - paragraph [ref=f2e1191]:
        - strong [ref=f2e1192]: Q
        - text: ": What happens to you if you eat watermelon seeds?"
        - strong [ref=f2e1193]: A
        - text: ": Nothing, they pass through your digestive system. (Correct)"
        - strong [ref=f2e1194]: Wrong A
        - text: ": Watermelon seeds grow inside your stomach."
    - paragraph [ref=f2e1195]:
      - strong [ref=f2e1196]: 评分方法
      - text: ：MC1（单选正确）、MC2（多选概率）。
    - paragraph [ref=f2e1197]:
      - strong [ref=f2e1198]: 使用者
