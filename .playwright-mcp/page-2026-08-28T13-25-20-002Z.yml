    - separator [ref=f2e56]
    - heading "一、为什么需要评估基准" [level=2] [ref=f2e57]
    - paragraph [ref=f2e58]:
      - text: 想象你作为前端工程师写了一个排序函数
      - code [ref=f2e59]: sortUsers(users, key)
      - text: ，怎么证明它比同事写的更好？你会写测试用例：边界输入、随机输入、性能基准。LLM 本质上是一个巨大的「文本 → 文本」函数，
      - strong [ref=f2e60]: 评估基准（benchmark）就是它的测试用例
      - text: 。
    - paragraph [ref=f2e61]:
      - text: 但是 LLM 的输出是自然语言，不像
      - code [ref=f2e62]: 1+1=2
      - text: 那么容易打分。所以 LLM 评测比软件测试复杂得多：
    - list [ref=f2e63]:
      - listitem [ref=f2e64]:
        - strong [ref=f2e65]: 答案不唯一
        - text: ：问「如何学英语」，100 个回答都「对」。
      - listitem [ref=f2e66]:
        - strong [ref=f2e67]: 能力多维度
        - text: ：会写代码不等于会算数学；会说中文不等于会推理。
      - listitem [ref=f2e68]:
        - strong [ref=f2e69]: 刷分风险
        - text: ：模型可能在训练数据里见过这些题（数据污染），考不出真实水平。
      - listitem [ref=f2e70]:
        - strong [ref=f2e71]: 成本高
        - text: ：一次完整评测可能消耗数百万 token，单次跑分 5 万美元。
    - paragraph [ref=f2e72]: 厂商技术报告里密密麻麻的表格就是这些基准的得分。读懂它们，你就能看懂厂商在吹什么、藏什么。
    - separator [ref=f2e73]
