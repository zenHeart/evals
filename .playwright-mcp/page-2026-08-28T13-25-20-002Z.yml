    - heading "19. HumanEval" [level=3] [ref=f2e569]
    - paragraph [ref=f2e570]:
      - strong [ref=f2e571]: 一句话
      - text: ：164 道 Python 函数题，OpenAI 2021 年出品的「祖师爷」代码基准。
    - paragraph [ref=f2e572]:
      - strong [ref=f2e573]: 解决问题
      - text: ：测模型能否根据函数签名+文档字符串写出可运行的 Python 函数。
    - paragraph [ref=f2e574]:
      - strong [ref=f2e575]: 规模与样例
      - text: ：164 题。
    - code [ref=f2e577]: "from typing import List def has_close_elements(numbers: List[float], threshold: float) -> bool: \"\"\" Check if in given list of numbers, are any two numbers closer to each other than given threshold. >>> has_close_elements([1.0, 2.0, 3.0], 0.5) False >>> has_close_elements([1.0, 2.8, 3.0, 4.0, 5.0, 2.0], 0.3) True \"\"\""
    - paragraph [ref=f2e578]:
      - strong [ref=f2e579]: 评估流程
      - text: ：题目 → 模型生成函数 → 跑测试用例（pass@k）。
    - paragraph [ref=f2e580]:
      - strong [ref=f2e581]: 评分方法
      - text: ：单元测试通过率（pass@1 / pass@10）。
    - paragraph [ref=f2e582]:
      - strong [ref=f2e583]: 局限性
      - text: ：题目简单、可能污染、Python 单一语言。
    - paragraph [ref=f2e584]:
      - strong [ref=f2e585]: 使用者
      - text: ：所有代码模型。
    - paragraph [ref=f2e586]:
      - strong [ref=f2e587]: 参考
