    - paragraph [ref=f2e912]:
      - strong [ref=f2e913]: 规模与样例
      - text: ：13 类任务，每类在不同长度（4K-128K）跑。
    - paragraph [ref=f2e914]:
      - strong [ref=f2e915]: 评分方法
      - text: ：精确匹配。
    - paragraph [ref=f2e916]:
      - strong [ref=f2e917]: 使用者
      - text: ：Yarn、阿里、DeepSeek、Anthropic 报告。
