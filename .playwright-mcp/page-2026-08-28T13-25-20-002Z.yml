    - heading "53. TruthfulQA" [level=3] [ref=f2e1183]
    - paragraph [ref=f2e1184]:
      - strong [ref=f2e1185]: 一句话
      - text: ：817 道陷阱题，诱导模型说常见但错误的答案。
    - paragraph [ref=f2e1186]:
      - strong [ref=f2e1187]: 解决问题
      - text: ：测模型是否会重复「人类常见的误解」。
