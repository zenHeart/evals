      - strong [ref=f2e909]: 一句话
      - text: ：NIAH 升级版，含 13 种长上下文任务（NIHA、NIAH、变量追踪、多跳 QA、聚合等）。
    - paragraph [ref=f2e910]:
      - strong [ref=f2e911]: 解决问题
