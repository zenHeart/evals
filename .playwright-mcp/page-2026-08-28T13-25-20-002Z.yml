    - separator [ref=f2e140]
    - heading "三、学科知识与综合推理" [level=2] [ref=f2e141]
    - paragraph [ref=f2e142]: 测的是「模型的博学程度」。给你一道题（A/B/C/D 四选一），看你能不能选对。
    - heading "1. MMLU（Massive Multitask Language Understanding）" [level=3] [ref=f2e143]
    - paragraph [ref=f2e144]:
      - strong [ref=f2e145]: 一句话
      - text: ：给模型 57 门大学课程的选择题，看它能不能毕业。
    - paragraph [ref=f2e146]:
      - strong [ref=f2e147]: 解决问题
      - text: ：测试模型的世界知识和基础推理能力，覆盖 STEM、社科、法律、医学等。
    - paragraph [ref=f2e148]:
      - strong [ref=f2e149]: 规模与样例
      - text: ：约 14,042 道四选一题。
    - blockquote [ref=f2e150]:
      - paragraph [ref=f2e151]:
        - strong [ref=f2e152]: Question
        - text: ": A statistician wants to study the ability of teenagers to negotiate. She selects 4 teenagers from a population of 10 to form a negotiation group. In how many ways can she do this? A) 5040 B) 15120 C) 210 D) 24"
        - strong [ref=f2e153]: Answer
        - text: ": C"
    - paragraph [ref=f2e154]:
      - strong [ref=f2e155]: 评估流程
      - text: ：题目 → 模型 → 选项字母 → 精确匹配正确答案。
    - paragraph [ref=f2e156]:
      - strong [ref=f2e157]: 评分方法
      - text: ：精确匹配（exact match）。
    - paragraph [ref=f2e158]:
      - strong [ref=f2e159]: 局限性
      - text: ：题目已公开，可能进入训练数据（污染）；纯选择题掩盖推理过程。
    - paragraph [ref=f2e160]:
      - strong [ref=f2e161]: 使用者
      - text: ：OpenAI、Anthropic、Google、Meta、Mistral、DeepSeek、Qwen、智谱、月之暗面全部使用。
    - paragraph [ref=f2e162]:
      - strong [ref=f2e163]: 参考
      - text: ：
      - link "论文" [ref=f2e164] [cursor=pointer]:
        - /url: https://arxiv.org/abs/2009.03300
      - text: "|"
      - link "HuggingFace" [ref=f2e165] [cursor=pointer]:
        - /url: https://huggingface.co/datasets/cais/mmlu
    - separator [ref=f2e166]
    - heading "2. MMLU-Pro" [level=3] [ref=f2e167]
    - paragraph [ref=f2e168]:
      - strong [ref=f2e169]: 一句话
      - text: ：MMLU 的「困难模式」，干扰项从 4 个涨到 10 个，必须真懂才行。
    - paragraph [ref=f2e170]:
      - strong [ref=f2e171]: 解决问题
      - text: ：MMLU 模型已饱和（90%+），Pro 加难度让刷分不再容易。
    - paragraph [ref=f2e172]:
      - strong [ref=f2e173]: 规模与样例
      - text: ：约 12,032 题，10 个选项，更多推理题。
    - blockquote [ref=f2e174]:
      - paragraph [ref=f2e175]:
        - strong [ref=f2e176]: Question
        - text: ": Which of the following best describes the structure of a nucleosome? A) Histone octamer wrapped with ~147 bp DNA B) Hexameric histone core with 200 bp linker DNA C) Single H1 histone with 30 nm fiber DNA D) Tetrameric histone with methylated CpG islands E-J: (其他干扰项)"
        - strong [ref=f2e177]: Answer
        - text: ": A"
    - paragraph [ref=f2e178]:
      - strong [ref=f2e179]: 评估流程
      - text: ：5-shot prompt → 模型输出 → 解析答案。
    - paragraph [ref=f2e180]:
      - strong [ref=f2e181]: 评分方法
      - text: ：精确匹配。
    - paragraph [ref=f2e182]:
      - strong [ref=f2e183]: 局限性
      - text: ：仍然选择题，推理过程不可见；中文支持弱。
    - paragraph [ref=f2e184]:
      - strong [ref=f2e185]: 使用者
      - text: ：GPT-4o、Claude 3.5 Sonnet、Gemini 1.5 Pro、DeepSeek-V3。
    - paragraph [ref=f2e186]:
      - strong [ref=f2e187]: 参考
      - text: ：
      - link "论文" [ref=f2e188] [cursor=pointer]:
        - /url: https://arxiv.org/abs/2406.01574
      - text: "|"
      - link "GitHub" [ref=f2e189] [cursor=pointer]:
        - /url: https://github.com/TIGER-Lab/MMLU-Pro
    - separator [ref=f2e190]
    - heading "3. CMMLU（Chinese MMLU）" [level=3] [ref=f2e191]
    - paragraph [ref=f2e192]:
      - strong [ref=f2e193]: 一句话
      - text: ：MMLU 的中文版，67 个学科，含驾照考试、税务计算等本土特色。
    - paragraph [ref=f2e194]:
      - strong [ref=f2e195]: 解决问题
      - text: ：测试中文世界知识与本土法规、习俗理解。
    - paragraph [ref=f2e196]:
      - strong [ref=f2e197]: 规模与样例
      - text: ：约 11,558 题。
    - blockquote [ref=f2e198]:
      - paragraph [ref=f2e199]:
        - strong [ref=f2e200]: Question
        - text: ": 根据《中华人民共和国劳动法》，用人单位拖欠或者未足额支付劳动报酬的，劳动者可以依法向人民法院申请？ A) 仲裁 B) 支付令 C) 调解 D) 起诉"
        - strong [ref=f2e201]: Answer
        - text: ": B"
    - paragraph [ref=f2e202]:
      - strong [ref=f2e203]: 评估流程
      - text: ：与 MMLU 类似。
    - paragraph [ref=f2e204]:
      - strong [ref=f2e205]: 评分方法
      - text: ：精确匹配。
    - paragraph [ref=f2e206]:
      - strong [ref=f2e207]: 局限性
      - text: ：题型相对单一；覆盖港澳台、海外华人需求不足。
    - paragraph [ref=f2e208]:
      - strong [ref=f2e209]: 使用者
      - text: ：Qwen、智谱 GLM、文心一言、月之暗面 Kimi、DeepSeek。
    - paragraph [ref=f2e210]:
      - strong [ref=f2e211]: 参考
      - text: ：
      - link "GitHub" [ref=f2e212] [cursor=pointer]:
        - /url: https://github.com/haonan-li/CMMLU
    - separator [ref=f2e213]
    - heading "4. C-Eval" [level=3] [ref=f2e214]
    - paragraph [ref=f2e215]:
      - strong [ref=f2e216]: 一句话
      - text: ：中文版的「MMLU + 高考 + 职业考试」，52 个学科。
    - paragraph [ref=f2e217]:
      - strong [ref=f2e218]: 解决问题
      - text: ：覆盖中国大学课程、公务员、医师、会计、计算机等考试。
    - paragraph [ref=f2e219]:
      - strong [ref=f2e220]: 规模与样例
      - text: ：约 14,106 题（4 个子集：验证、测试、社会科学、STEM）。
    - blockquote [ref=f2e221]:
      - paragraph [ref=f2e222]:
        - strong [ref=f2e223]: Question
        - text: ": 下列关于光合作用的叙述，正确的是？ A) 光合作用只在叶片中进行 B) 光反应在叶绿体类囊体薄膜上进行 C) 暗反应不消耗 ATP D) 光合作用不产生氧气"
        - strong [ref=f2e224]: Answer
        - text: ": B"
    - paragraph [ref=f2e225]:
      - strong [ref=f2e226]: 评分方法
      - text: ：精确匹配。
    - paragraph [ref=f2e227]:
      - strong [ref=f2e228]: 使用者
      - text: ：所有中文厂商 + 国际厂商本地化测试。
    - paragraph [ref=f2e229]:
      - strong [ref=f2e230]: 参考
      - text: ：
      - link "GitHub" [ref=f2e231] [cursor=pointer]:
        - /url: https://github.com/SJTU-LWP/ceval
    - separator [ref=f2e232]
    - heading "5. AGIEval" [level=3] [ref=f2e233]
    - paragraph [ref=f2e234]:
      - strong [ref=f2e235]: 一句话
      - text: ：用真实高考、考研、律师资格考试题直接考模型。
    - paragraph [ref=f2e236]:
      - strong [ref=f2e237]: 解决问题
      - text: ：与人类考生同台对比，验证模型能否通过真实考试。
    - paragraph [ref=f2e238]:
      - strong [ref=f2e239]: 规模与样例
      - text: ：约 8,062 题，覆盖中国高考、美国 SAT、LSAT、GRE、医师执照等。
    - paragraph [ref=f2e240]:
      - strong [ref=f2e241]: 评分方法
      - text: ：精确匹配（选择题）。
    - paragraph [ref=f2e242]:
      - strong [ref=f2e243]: 使用者
      - text: ：OpenAI、百度、Qwen 等。
    - paragraph [ref=f2e244]:
      - strong [ref=f2e245]: 参考
      - text: ：
      - link "GitHub" [ref=f2e246] [cursor=pointer]:
        - /url: https://github.com/ruixiangcui/AGIEval
    - separator [ref=f2e247]
    - heading "6. ARC-AGI / ARC-Challenge" [level=3] [ref=f2e248]
    - paragraph [ref=f2e249]:
      - strong [ref=f2e250]: 一句话
      - text: ：给一个 3×3 的彩色方格图，问下一个状态的颜色，测「抽象推理」。
    - paragraph [ref=f2e251]:
      - strong [ref=f2e252]: 解决问题
      - text: ：测人类级别的「流体智力」（fluent intelligence），而非死记硬背。
    - paragraph [ref=f2e253]:
      - strong [ref=f2e254]: 规模与样例
      - text: ：约 1,000 道题 + 私有测试集 120 题。
    - blockquote [ref=f2e255]:
      - paragraph [ref=f2e256]:
        - strong [ref=f2e257]: Input grid
        - text: ": 一个 2×2 蓝红交替；下一个 3×3 应该是？"
    - paragraph [ref=f2e258]:
      - strong [ref=f2e259]: 评估流程
      - text: ：网格 → 模型输出 JSON → 比对。
    - paragraph [ref=f2e260]:
      - strong [ref=f2e261]: 评分方法
      - text: ：精确匹配颜色矩阵。
    - paragraph [ref=f2e262]:
      - strong [ref=f2e263]: 局限性
      - text: ：纯视觉-空间推理，不代表综合智能；2024 年仍是公开未解难题。
    - paragraph [ref=f2e264]:
      - strong [ref=f2e265]: 使用者
      - text: ：OpenAI o1/o3、DeepSeek-R1、Claude 3.7。
    - paragraph [ref=f2e266]:
      - strong [ref=f2e267]: 参考
      - text: ：
      - link "arcprizes.org" [ref=f2e268] [cursor=pointer]:
        - /url: https://arcprizes.org
    - separator [ref=f2e269]
    - heading "7. BBH（Big Bench Hard）" [level=3] [ref=f2e270]
    - paragraph [ref=f2e271]:
      - strong [ref=f2e272]: 一句话
      - text: ：从 200+ BIG-Bench 任务里挑出 23 个 LLM 表现最差的，作为「挑战关」。
    - paragraph [ref=f2e273]:
      - strong [ref=f2e274]: 解决问题
      - text: ：当模型在简单任务上得分饱和后，找更难的子集继续测。
    - paragraph [ref=f2e275]:
      - strong [ref=f2e276]: 规模与样例
      - text: ：23 个任务，共 6,511 题。
    - paragraph [ref=f2e277]:
      - strong [ref=f2e278]: 评分方法
      - text: ：精确匹配。
