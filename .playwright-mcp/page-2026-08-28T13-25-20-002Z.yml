    - paragraph [ref=f2e2558]:
      - strong [ref=f2e2559]: 说明
      - text: ：✓ 表示该厂商在最近 1 年的官方报告中引用过该基准。中文厂商引用国际基准的情况也在统计内。中文特色基准（CMMLU、C-Eval）在国际厂商报告中引用较少，主要原因是早期聚焦英文。
    - separator [ref=f2e2560]
    - heading "二十、给初级前端工程师的入门导读" [level=2] [ref=f2e2561]
    - paragraph [ref=f2e2562]: 读到这里，你应该已经了解了 100+ 评估基准。但这堆信息怎么用到日常？下面是给前端工程师的「入门 5 步」。
    - heading "1. 看厂商技术报告的「评估表」先看表头" [level=3] [ref=f2e2563]
    - paragraph [ref=f2e2564]: 打开 GPT-4 技术报告，第一页都是这种表格：
    - code [ref=f2e2566]: "| | GPT-4o | Claude 3.5 | Gemini 1.5 | Llama 3.1 | |---|---|---|---|---| | MMLU | 88.0 | 88.7 | 85.9 | 86.0 | | GSM8K | 96.6 | 96.4 | 90.9 | 95.4 | | HumanEval | 90.2 | 93.0 | 84.1 | 86.0 | | GPQA | 53.6 | 59.4 | 46.2 | 51.0 |"
    - paragraph [ref=f2e2567]:
      - strong [ref=f2e2568]: 怎么看
      - text: ：
    - list [ref=f2e2569]:
      - listitem [ref=f2e2570]: 数字越大越好（一般 0-100，或者 0-1）。
      - listitem [ref=f2e2571]: 厂商会挑自己最强的项放在显眼位置。
      - listitem [ref=f2e2572]: 看绝对值 + 跨厂商对比才客观。
      - listitem [ref=f2e2573]:
        - text: 注意
        - strong [ref=f2e2574]: 基线日期
        - text: ：3 个月前的「SOTA」可能已被超越。
    - heading "2. 关注「新兴」基准——Chatbot Arena 是金标准" [level=3] [ref=f2e2575]
    - paragraph [ref=f2e2576]: LMSYS Arena 的 Elo 是最可信的人类偏好。每个月看一次就知道谁强了：
    - list [ref=f2e2577]:
      - listitem [ref=f2e2578]: 2024.06：Claude 3.5 Sonnet 登顶
      - listitem [ref=f2e2579]: 2024.12：o3 预览版领先
      - listitem [ref=f2e2580]: 2025.06：DeepSeek-R1 进入前 5
    - heading "3. 注意「数据污染」" [level=3] [ref=f2e2581]
    - paragraph [ref=f2e2582]: 模型可能在训练时见过原题。比如 HumanEval 才 164 题，几乎所有模型都过拟合。
    - paragraph [ref=f2e2583]:
      - strong [ref=f2e2584]: 避坑提示
      - text: ：
    - list [ref=f2e2585]:
      - listitem [ref=f2e2586]:
        - text: 优先看
        - strong [ref=f2e2587]: 新基准
        - text: （LiveCodeBench、ARC-AGI）；
      - listitem [ref=f2e2588]:
        - text: 看
        - strong [ref=f2e2589]: 测试集是否私有
        - text: （MMLU 公开，FrontierMath 私有，私有更可信）；
      - listitem [ref=f2e2590]:
        - text: 看
        - strong [ref=f2e2591]: 多基准综合
        - text: （Chatbot Arena 综合了 100+ 任务）。
    - heading "4. 自己跑一个 mini 评估" [level=3] [ref=f2e2592]
    - paragraph [ref=f2e2593]: 不需要 5 万美元。Chrome 控制台 + OpenAI/Claude API Key 就能体验：
    - code [ref=f2e2595]: "// 在浏览器 console 里跑 mini 评测 async function miniEval() { const questions = [ { q: \"9.9 和 9.11 谁大？\", a: \"9.11\" }, { q: \"strawberry 里有几个 r？\", a: \"3\" }, { q: \"树上有 5 只鸟，开枪打死 1 只，还剩几只？\", a: \"0\" }, ]; for (const { q, a } of questions) { const res = await fetch(\"https://api.openai.com/v1/chat/completions\", { method: \"POST\", headers: { \"Content-Type\": \"application/json\", \"Authorization\": \"Bearer \" + getApiKey() // 替换为你的 key }, body: JSON.stringify({ model: \"gpt-4o-mini\", messages: [{ role: \"user\", content: q }], }) }).then(r => r.json()); const answer = res.choices[0].message.content; const correct = answer.includes(a); console.log(`Q: ${q}\\nA: ${answer}\\n✓ ${correct}\\n`); } } miniEval();"
    - paragraph [ref=f2e2596]:
      - strong [ref=f2e2597]: 进阶玩法
      - text: ：
    - list [ref=f2e2598]:
      - listitem [ref=f2e2599]: 把问题换成 IFEval 的精确指令（"写一首诗，含 5 个 'cat'"）；
      - listitem [ref=f2e2600]: 对比 GPT-4o、Claude、DeepSeek 三家回答；
      - listitem [ref=f2e2601]: 计算胜率（参考 AlpacaEval 方法）。
    - heading "5. 找「实测报告」+「社区」" [level=3] [ref=f2e2602]
    - paragraph [ref=f2e2603]: 单一基准不可信，多源交叉验证：
    - list [ref=f2e2604]:
      - listitem [ref=f2e2605]: 官方报告（厂商自己跑）
      - listitem [ref=f2e2606]: LMSYS Arena（人类盲测）
      - listitem [ref=f2e2607]: Artificial Analysis（独立第三方）
      - listitem [ref=f2e2608]: Reddit r/LocalLLaMA（社区实测）
    - separator [ref=f2e2609]
