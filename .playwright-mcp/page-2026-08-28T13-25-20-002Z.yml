    - heading "22. CodeContests" [level=3] [ref=f2e610]
    - paragraph [ref=f2e611]:
      - strong [ref=f2e612]: 一句话
      - text: ：DeepMind 出品，13600 道 Codeforces 编程竞赛真题。
    - paragraph [ref=f2e613]:
      - strong [ref=f2e614]: 规模与样例
      - text: ：13,600 题。
    - paragraph [ref=f2e615]:
      - strong [ref=f2e616]: 评分方法
      - text: ：编译通过 + 全部测试用例通过。
    - paragraph [ref=f2e617]:
      - strong [ref=f2e618]: 使用者
      - text: ：AlphaCode、DeepSeek-Coder。
    - separator [ref=f2e619]
    - heading "23. LiveCodeBench" [level=3] [ref=f2e620]
    - paragraph [ref=f2e621]:
      - strong [ref=f2e622]: 一句话
      - text: ：从 LeetCode、Codeforces、AtCoder 每月抓新题，避免数据污染。
    - paragraph [ref=f2e623]:
      - strong [ref=f2e624]: 解决问题
      - text: ：传统基准被「刷完了」，LiveCodeBench 用「新题」持续监测真实能力。
    - paragraph [ref=f2e625]:
      - strong [ref=f2e626]: 规模与样例
      - text: ：每月更新，目前累计约 1000+ 题。
    - paragraph [ref=f2e627]:
      - strong [ref=f2e628]: 评分方法
      - text: ：pass@k。
    - paragraph [ref=f2e629]:
      - strong [ref=f2e630]: 使用者
      - text: ：OpenAI、Anthropic、Google、DeepSeek 全部使用。
    - paragraph [ref=f2e631]:
      - strong [ref=f2e632]: 参考
      - text: ：
      - link "livecodebench.github.io" [ref=f2e633] [cursor=pointer]:
        - /url: https://livecodebench.github.io
    - separator [ref=f2e634]
    - heading "24. Codeforces Rating" [level=3] [ref=f2e635]
    - paragraph [ref=f2e636]:
      - strong [ref=f2e637]: 一句话
      - text: ：直接拿模型在 Codeforces 模拟比赛，根据分数给「Rating」。
    - paragraph [ref=f2e638]:
      - strong [ref=f2e639]: 解决问题
      - text: ：用真实竞赛平台给模型打分，避免人为构造题目的偏差。
    - paragraph [ref=f2e640]:
      - strong [ref=f2e641]: 规模与样例
      - text: ：约 5000+ 题。
    - paragraph [ref=f2e642]:
      - strong [ref=f2e643]: 评分方法
      - text: ：模拟比赛 → Elo Rating。
    - paragraph [ref=f2e644]:
      - strong [ref=f2e645]: 使用者
      - text: ：DeepSeek-R1、o3、Claude 3.7。
    - separator [ref=f2e646]
    - heading "25. SWE-bench（Verified / Lite / Multilingual）" [level=3] [ref=f2e647]
    - paragraph [ref=f2e648]:
      - strong [ref=f2e649]: 一句话
      - text: ：给模型一个真实 GitHub Issue，让它在代码库里改 Bug 并通过测试。
    - paragraph [ref=f2e650]:
      - strong [ref=f2e651]: 解决问题
      - text: ：测「真实软件工程能力」——读懂仓库、写补丁、跑通测试。
    - paragraph [ref=f2e652]:
      - strong [ref=f2e653]: 规模与样例
      - text: ：
    - list [ref=f2e654]:
      - listitem [ref=f2e655]: SWE-bench Verified：500 题（人工审核）
      - listitem [ref=f2e656]: SWE-bench Lite：300 题（精简）
      - listitem [ref=f2e657]: SWE-bench Multilingual：300 题（多语言）
    - paragraph [ref=f2e658]:
      - strong [ref=f2e659]: 评估流程
      - text: ：
    - list [ref=f2e660]:
      - listitem [ref=f2e661]: 选定 GitHub 仓库的某个 Issue；
      - listitem [ref=f2e662]: 模型下载仓库快照；
      - listitem [ref=f2e663]: 修改代码生成 patch；
      - listitem [ref=f2e664]: 应用 patch → 跑 fail-to-pass 测试；
      - listitem [ref=f2e665]: 通过 = 成功。
    - paragraph [ref=f2e666]:
      - strong [ref=f2e667]: 评分方法
      - text: ：测试用例通过率。
    - paragraph [ref=f2e668]:
      - strong [ref=f2e669]: 局限性
      - text: ：仓库规模小（平均 ~1000 行）、修复类型有限。
    - paragraph [ref=f2e670]:
      - strong [ref=f2e671]: 使用者
      - text: ：Anthropic Claude 3.7、DeepSeek-R1、Qwen-Coder、OpenAI o3。
    - paragraph [ref=f2e672]:
      - strong [ref=f2e673]: 参考
      - text: ：
      - link "SWE-bench" [ref=f2e674] [cursor=pointer]:
        - /url: https://www.swebench.com
    - separator [ref=f2e675]
    - heading "26. MultiPL-E" [level=3] [ref=f2e676]
    - paragraph [ref=f2e677]:
      - strong [ref=f2e678]: 一句话
      - text: ：把 HumanEval 翻译成 18 种语言（JS、TS、Go、Rust、Java、C++）。
    - paragraph [ref=f2e679]:
      - strong [ref=f2e680]: 解决问题
      - text: ：测模型在多语言编程的能力。
    - paragraph [ref=f2e681]:
      - strong [ref=f2e682]: 规模与样例
      - text: ：164 × 18 ≈ 2952 题。
    - paragraph [ref=f2e683]:
      - strong [ref=f2e684]: 评分方法
      - text: ：pass@k。
    - paragraph [ref=f2e685]:
      - strong [ref=f2e686]: 使用者
      - text: ：DeepSeek-Coder、Code Llama、Qwen-Coder。
    - separator [ref=f2e687]
    - heading "27. RepoBench" [level=3] [ref=f2e688]
    - paragraph [ref=f2e689]:
      - strong [ref=f2e690]: 一句话
      - text: ：测「仓库级」代码理解——给定大段上下文，补全函数。
    - paragraph [ref=f2e691]:
      - strong [ref=f2e692]: 规模与样例
      - text: ：约 50 万函数（Python + Java）。
    - paragraph [ref=f2e693]:
      - strong [ref=f2e694]: 评分方法
      - text: ：精确匹配或 BLEU。
    - separator [ref=f2e695]
    - heading "28. BigCodeBench" [level=3] [ref=f2e696]
    - paragraph [ref=f2e697]:
      - strong [ref=f2e698]: 一句话
      - text: ：HumanEval 的「困难模式」，1140 道题，需要调用 139 个库（pandas、numpy、requests）。
    - paragraph [ref=f2e699]:
      - strong [ref=f2e700]: 解决问题
      - text: ：HumanEval 太简单，BigCodeBench 要求真实工具调用。
    - paragraph [ref=f2e701]:
      - strong [ref=f2e702]: 规模与样例
      - text: ：1140 题。
    - code [ref=f2e704]: "# 简化题面 def task_func(df: pd.DataFrame, columns: list[str]) -> pd.DataFrame: \"\"\"对 df 按 columns 做 groupby 并返回每组 size 的 DataFrame\"\"\""
    - paragraph [ref=f2e705]:
      - strong [ref=f2e706]: 评分方法
      - text: ：跑完整测试。
    - paragraph [ref=f2e707]:
      - strong [ref=f2e708]: 使用者
      - text: ：BigCode 项目，DeepSeek-Coder-V2、Qwen-Coder。
    - paragraph [ref=f2e709]:
      - strong [ref=f2e710]: 参考
      - text: ：
      - link "bigcode-bench.github.io" [ref=f2e711] [cursor=pointer]:
        - /url: https://bigcode-bench.github.io
    - separator [ref=f2e712]
    - heading "29. DS-1000（Data Science）" [level=3] [ref=f2e713]
    - paragraph [ref=f2e714]:
      - strong [ref=f2e715]: 一句话
      - text: ：1000 道数据科学代码题，覆盖 numpy、pandas、scipy、sklearn、pytorch、matplotlib。
    - paragraph [ref=f2e716]:
      - strong [ref=f2e717]: 规模与样例
      - text: ：1000 题。
    - paragraph [ref=f2e718]:
      - strong [ref=f2e719]: 评分方法
      - text: ：执行测试。
    - paragraph [ref=f2e720]:
      - strong [ref=f2e721]: 使用者
      - text: ：Code Llama、DeepSeek-Coder。
    - separator [ref=f2e722]
    - heading "30. Spider（Text-to-SQL）" [level=3] [ref=f2e723]
    - paragraph [ref=f2e724]:
      - strong [ref=f2e725]: 一句话
      - text: ：给自然语言问题 + 数据库 Schema，写 SQL。
    - paragraph [ref=f2e726]:
      - strong [ref=f2e727]: 规模与样例
      - text: ：10,181 题，200 个数据库，138 个领域。
    - blockquote [ref=f2e728]:
      - paragraph [ref=f2e729]:
        - strong [ref=f2e730]: Database
        - text: ": pet_store"
        - strong [ref=f2e731]: Question
        - text: ": What are the names of pets whose weight is heavier than 10?"
        - strong [ref=f2e732]: SQL
        - text: ": SELECT name FROM pets WHERE weight > 10"
    - paragraph [ref=f2e733]:
      - strong [ref=f2e734]: 评分方法
      - text: ：执行结果匹配。
    - paragraph [ref=f2e735]:
      - strong [ref=f2e736]: 使用者
      - text: ：所有 NL2SQL 研究。
    - separator [ref=f2e737]
    - heading "31. BIRD（Text-to-SQL）" [level=3] [ref=f2e738]
    - paragraph [ref=f2e739]:
      - strong [ref=f2e740]: 一句话
      - text: ：Spider 升级版，12,751 题，含真实数据库（更大、更脏数据）。
    - paragraph [ref=f2e741]:
      - strong [ref=f2e742]: 评分方法
      - text: ：执行准确率（Execution Accuracy）+ 有效效率得分（VES）。
    - paragraph [ref=f2e743]:
      - strong [ref=f2e744]: 使用者
      - text: ：OpenAI、阿里、DuckDB 项目。
    - separator [ref=f2e745]
    - heading "32. ML-Bench" [level=3] [ref=f2e746]
    - paragraph [ref=f2e747]:
      - strong [ref=f2e748]: 一句话
      - text: ：测模型在「机器学习任务」上的代码能力——给定 ML 任务描述，写训练代码。
    - paragraph [ref=f2e749]:
      - strong [ref=f2e750]: 规模与样例
      - text: ：约 100 题。
    - separator [ref=f2e751]
    - heading "33. ToolBench / API-Bank" [level=3] [ref=f2e752]
    - paragraph [ref=f2e753]:
      - strong [ref=f2e754]: 一句话
      - text: ：测模型调用 16000+ 真实 API（搜索、计算、天气）的能力。
    - paragraph [ref=f2e755]:
      - strong [ref=f2e756]: 规模与样例
      - text: ：约 10 万次 API 调用轨迹。
    - paragraph [ref=f2e757]:
      - strong [ref=f2e758]: 评分方法
      - text: ：任务完成率。
    - separator [ref=f2e759]
    - heading "34. BFCL（Berkeley Function Calling Leaderboard）" [level=3] [ref=f2e760]
    - paragraph [ref=f2e761]:
      - strong [ref=f2e762]: 一句话
      - text: ：专门测「Function Calling」能力——给模型一组函数定义和用户问题，看它能否正确选函数 + 填参数。
    - paragraph [ref=f2e763]:
      - strong [ref=f2e764]: 规模与样例
      - text: ：
    - list [ref=f2e765]:
      - listitem [ref=f2e766]: BFCL v1：5000+ 测试
      - listitem [ref=f2e767]: BFCL v3（2025）：含 Live、Multiple、Parallel、Parallel-Multiple 等多种场景
    - paragraph [ref=f2e768]:
      - strong [ref=f2e769]: 评估流程
      - text: ：
    - list [ref=f2e770]:
      - listitem [ref=f2e771]: 输入：用户问题 + JSON Schema 函数定义
      - listitem [ref=f2e772]: 模型输出：函数名 + 参数
      - listitem [ref=f2e773]: 比对：精确 JSON 等价
    - paragraph [ref=f2e774]:
      - strong [ref=f2e775]: 使用者
      - text: ：OpenAI、Anthropic、Google、Mistral、Meta 全部参与。
    - paragraph [ref=f2e776]:
      - strong [ref=f2e777]: 参考
      - text: ：
