    - heading "119. Prompting 元评估" [level=3] [ref=f2e2123]
    - paragraph [ref=f2e2124]: 测试不同的 prompting 技术（CoT、ToT、Self-Consistency、ReAct）的效果。
    - paragraph [ref=f2e2125]:
      - strong [ref=f2e2126]: 关键基线
      - text: ：
    - list [ref=f2e2127]:
      - listitem [ref=f2e2128]: Zero-shot：直接回答
      - listitem [ref=f2e2129]: Few-shot：给 3-5 个示例
      - listitem [ref=f2e2130]: CoT（Chain-of-Thought）：「一步步想」
      - listitem [ref=f2e2131]: Self-Consistency：多次采样投票
      - listitem [ref=f2e2132]: ToT（Tree of Thoughts）：搜索思维树
      - listitem [ref=f2e2133]: ReAct：Reasoning + Acting 交替
    - paragraph [ref=f2e2134]:
      - strong [ref=f2e2135]: 通用结论
      - text: ：o1/o3、DeepSeek-R1 通过「内在 CoT」（在回答前先生成思考过程）大幅提升所有基准。
