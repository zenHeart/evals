    - heading "六、长上下文" [level=2] [ref=f2e887]
    - paragraph [ref=f2e888]: 「100K、200K、1M tokens」——这是厂商主战场。问题：上下文越长，模型越容易「忘了中间说过啥」。
    - heading "35. Needle-in-a-Haystack（NIAH）" [level=3] [ref=f2e889]
    - paragraph [ref=f2e890]:
      - strong [ref=f2e891]: 一句话
      - text: ：在 100K 文本里藏一句随机事实，问模型能否找到。
    - paragraph [ref=f2e892]:
      - strong [ref=f2e893]: 解决问题
      - text: ：测长上下文检索能力。
    - paragraph [ref=f2e894]:
      - strong [ref=f2e895]: 规模与样例
      - text: ：任意长度，可自定义（4K、32K、128K、1M）。
    - blockquote [ref=f2e896]:
      - paragraph [ref=f2e897]: 在 100K 随机文章中插入：The best thing to do in San Francisco is to eat a sandwich at ... [random] 问题：The best thing to do in San Francisco is?
    - paragraph [ref=f2e898]:
      - strong [ref=f2e899]: 评估流程
      - text: ：插入「针」→ 模型 → 提取答案。
    - paragraph [ref=f2e900]:
      - strong [ref=f2e901]: 评分方法
      - text: ：精确匹配。
    - paragraph [ref=f2e902]:
      - strong [ref=f2e903]: 可视化
      - text: ：通常画成热力图，X 轴位置（针在哪里）、Y 轴长度（上下文多长）、颜色 = 准确率。
    - paragraph [ref=f2e904]:
      - strong [ref=f2e905]: 使用者
      - text: ：GPT-4o（128K）、Claude 3.7（200K）、Gemini 2.0（1M）、Qwen2.5（1M）、DeepSeek-V3（128K）。
    - separator [ref=f2e906]
