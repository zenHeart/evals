name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build EPUB & Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate book structure
        run: node book/validate.js

      - name: Preprocess chapters
        run: node book/preprocess.js

      - name: Build EPUB
        run: node book/build-epub.mjs evals.epub

      - name: Verify EPUB
        run: |
          test -f evals.epub
          unzip -l evals.epub | head -10
          ls -lh evals.epub

      - name: Validate data layer
        run: |
          if [ -f scripts/validate-data.mjs ]; then node scripts/validate-data.mjs; fi

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Validate site structure
        run: node scripts/validate-site.mjs

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-epub
          path: evals.epub
          retention-days: 90
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-web
          path: dist/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-epub
          path: ./download/evals-epub

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-web
          path: ./download/evals-web

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp download/evals-epub/evals.epub _site/
          cp download/evals-web/cover.svg _site/
          cp -r download/evals-web/* _site/
          echo "evals.zenheart.site" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
