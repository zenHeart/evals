name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build EPUB & Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Check skills drift
        run: node scripts/sync-skills.mjs --check

      - name: Validate book structure
        run: node book/validate.js

      - name: Test model selection and coverage
        run: npm test

      - name: Preprocess chapters
        run: node book/preprocess.js

      - name: Build EPUB
        run: node book/build-epub.mjs evals.epub

      - name: Verify EPUB
        run: |
          test -f evals.epub
          unzip -l evals.epub | head -10
          ls -lh evals.epub

      - name: Validate data layer
        run: |
          if [ -f scripts/validate-data.mjs ]; then node scripts/validate-data.mjs; fi

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Validate site structure
        run: node scripts/validate-site.mjs

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-epub
          path: evals.epub
          retention-days: 90
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-web
          path: dist/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # push 与 workflow_dispatch 都要能部署：非 push 事件（如手工重部署）此前被整段跳过，
    # 造成主干已是 v2、线上仍是旧版而无人发现。分支仍限定 main，构建门禁不变。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-epub
          path: ./download/evals-epub

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-web
          path: ./download/evals-web

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp download/evals-epub/evals.epub _site/
          cp download/evals-web/cover.svg _site/
          cp -r download/evals-web/* _site/
          echo "evals.zenheart.site" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact visibility
        run: |
          # actions/deploy-pages@v4 查 artifact 不读 REST 的 run artifacts 接口，而是直接请求
          # Twirp ArtifactService.ListArtifacts：POST ${ACTIONS_RESULTS_URL 的 origin}/
          # twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts，带
          # Bearer ACTIONS_RUNTIME_TOKEN，请求体为 workflow_run_backend_id /
          # workflow_job_run_backend_id（由该令牌 scp 里的 Actions.Results scope 解析，
          # 见 @actions/artifact 的 getBackendIdsFromToken / internalArtifactTwirpClient），
          # 再按 name === "github-pages" 过滤，0 个就让整次部署失败。
          # 该后端与 REST 列表各自独立传播：REST 能查到不等于它能查到。实测 run 45367368858
          # REST 查到后 0.4 s，它仍只返回 2 个 artifact（缺 github-pages）。因此这里改走同一条
          # 通道轮询，直到 deploy-pages 真正能查到唯一一个 github-pages；查不到就失败，
          # 不掩盖问题。构建门禁、needs 与分支限定均未改动。
          set -uo pipefail
          ORIGIN="$(node -e 'process.stdout.write(new URL(process.env.ACTIONS_RESULTS_URL).origin)')"
          BODY="$(node -e '
            const seg = process.env.ACTIONS_RUNTIME_TOKEN.split(".")[1];
            const scp = JSON.parse(Buffer.from(seg, "base64url")).scp;
            const p = scp.split(" ").map(s => s.split(":")).find(x => x[0] === "Actions.Results" && x.length === 3);
            if (!p) throw new Error("no Actions.Results scope in ACTIONS_RUNTIME_TOKEN");
            process.stdout.write(JSON.stringify({
              workflow_run_backend_id: p[1],
              workflow_job_run_backend_id: p[2],
            }));
          ')"
          URL="$ORIGIN/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts"
          for i in $(seq 1 40); do
            resp="$(curl -sS --max-time 20 -X POST "$URL" \
                     -H "authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
                     -H 'content-type: application/json' \
                     -d "$BODY" 2>/dev/null || true)"
            n="$(printf '%s' "$resp" | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                try {
                  process.stdout.write(String((JSON.parse(s).artifacts || [])
                    .filter(a => a.name === "github-pages").length));
                } catch { process.stdout.write("err"); }
              });
            ')"
            if [ "$n" = "1" ]; then
              echo "github-pages visible on the artifact service after $((i * 3))s"
              exit 0
            fi
            if [ "$n" != "err" ] && [ -n "$n" ] && [ "$n" -gt 1 ]; then
              echo "::error::found $n github-pages artifacts on the artifact service; deploy-pages requires exactly one"
              exit 1
            fi
            echo "attempt $i: artifact service reports ${n:-no-response} github-pages artifact(s)"
            sleep 3
          done
          echo "::error::github-pages never became visible on the artifact service that deploy-pages reads"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
