name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build EPUB & Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Check skills drift
        run: node scripts/sync-skills.mjs --check

      - name: Validate book structure
        run: node book/validate.js

      - name: Test model selection and coverage
        run: npm test

      - name: Preprocess chapters
        run: node book/preprocess.js

      - name: Build EPUB
        run: node book/build-epub.mjs evals.epub

      - name: Verify EPUB
        run: |
          test -f evals.epub
          unzip -l evals.epub | head -10
          ls -lh evals.epub

      - name: Validate data layer
        run: |
          if [ -f scripts/validate-data.mjs ]; then node scripts/validate-data.mjs; fi

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Validate site structure
        run: node scripts/validate-site.mjs

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-epub
          path: evals.epub
          retention-days: 90
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-web
          path: dist/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # push 与 workflow_dispatch 都要能部署：非 push 事件（如手工重部署）此前被整段跳过，
    # 造成主干已是 v2、线上仍是旧版而无人发现。分支仍限定 main，构建门禁不变。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-epub
          path: ./download/evals-epub

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-web
          path: ./download/evals-web

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp download/evals-epub/evals.epub _site/
          cp download/evals-web/cover.svg _site/
          cp -r download/evals-web/* _site/
          echo "evals.zenheart.site" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-pages-artifact 落盘后，artifact 列表 API 有秒级传播延迟；
          # deploy-pages 立刻按名查询会得到 "No artifacts named github-pages were found"。
          # 这里等到真的能查到再部署，避免整次部署因传播延迟而失败。
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
                 | grep -q .; then
              echo "github-pages artifact visible after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact never became listable"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
