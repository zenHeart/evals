name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build EPUB & Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Check skills drift
        run: node scripts/sync-skills.mjs --check

      - name: Validate book structure
        run: node book/validate.js

      - name: Test model selection and coverage
        run: npm test

      - name: Preprocess chapters
        run: node book/preprocess.js

      - name: Build EPUB
        run: node book/build-epub.mjs evals.epub

      - name: Verify EPUB
        run: |
          test -f evals.epub
          unzip -l evals.epub | head -10
          ls -lh evals.epub

      - name: Validate data layer
        run: |
          if [ -f scripts/validate-data.mjs ]; then node scripts/validate-data.mjs; fi

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Validate site structure
        run: node scripts/validate-site.mjs

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-epub
          path: evals.epub
          retention-days: 90
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-web
          path: dist/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # push 与 workflow_dispatch 都要能部署：非 push 事件（如手工重部署）此前被整段跳过，
    # 造成主干已是 v2、线上仍是旧版而无人发现。分支仍限定 main，构建门禁不变。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.resolve_page_url.outputs.page_url }}
    steps:
      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-epub
          path: ./download/evals-epub

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: evals-web
          path: ./download/evals-web

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp download/evals-epub/evals.epub _site/
          cp download/evals-web/cover.svg _site/
          cp -r download/evals-web/* _site/
          echo "evals.zenheart.site" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # deploy-pages@v4 读的不是 REST 的 artifact 列表，而是 artifact service 的索引：
          # 它用 @actions/artifact 的 listArtifactsInternal() → POST
          # {ACTIONS_RESULTS_URL origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts，
          # 请求体只有 workflow_run_backend_id / workflow_job_run_backend_id
          # （从 ACTIONS_RUNTIME_TOKEN 的 scp 里 Actions.Results scope 解析），
          # 按 name === "github-pages" 过滤，且只查一次、不重试（见 deployment.js 的 create()）。
          # 该索引与 REST 的 run artifacts 列表各自独立传播，快慢不同：
          #   run 45367368858 / 45373407473：REST 3 秒内就列出了 github-pages，
          #   但 artifact service 此刻只返回 2 个 artifact（缺 github-pages）→ 整次部署被判失败；
          #   run 45365815270：上传完成后隔了 6.5 秒才查，索引已跟上 → 部署成功。
          # 所以"等 REST 可见"并不足以保证 deploy-pages 查得到，必须等同一条通道。
          # 本步骤只观测、不阻断：成败由 deploy → 重试 → 断言三步决定。
          # 此前 fc56a57 把这条等待做成硬闸门，而 run step 拿不到内部运行时变量
          # （ACTIONS_RESULTS_URL 不会注入到 run step），于是它自己把部署连续判死 6 次。
          set -uo pipefail
          echo "ACTIONS_* variables visible in this step: $(env | sed -n 's/^\(ACTIONS_[A-Z_]*\)=.*/\1/p' | tr '\n' ' ')"
          ORIGIN=""
          if [ -n "${ACTIONS_RESULTS_URL:-}" ]; then
            ORIGIN="$(node -e 'process.stdout.write(new URL(process.env.ACTIONS_RESULTS_URL).origin)' 2>/dev/null || true)"
          fi
          if [ -n "$ORIGIN" ] && [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            echo "polling the artifact service deploy-pages actually reads: $ORIGIN"
            BODY="$(node -e '
              const seg = process.env.ACTIONS_RUNTIME_TOKEN.split(".")[1];
              const scp = JSON.parse(Buffer.from(seg, "base64url")).scp;
              const p = scp.split(" ").map(s => s.split(":")).find(x => x[0] === "Actions.Results" && x.length === 3);
              if (!p) throw new Error("no Actions.Results scope in ACTIONS_RUNTIME_TOKEN");
              process.stdout.write(JSON.stringify({
                workflow_run_backend_id: p[1],
                workflow_job_run_backend_id: p[2],
              }));
            ' 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              URL="$ORIGIN/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts"
              for i in $(seq 1 40); do
                resp="$(curl -sS --max-time 20 -X POST "$URL" \
                         -H "authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
                         -H 'content-type: application/json' \
                         -d "$BODY" 2>/dev/null || true)"
                n="$(printf '%s' "$resp" | node -e '
                  let s = "";
                  process.stdin.on("data", d => s += d).on("end", () => {
                    try {
                      process.stdout.write(String((JSON.parse(s).artifacts || [])
                        .filter(a => a.name === "github-pages").length));
                    } catch { process.stdout.write("err"); }
                  });
                ')"
                if [ "$n" = "1" ]; then
                  echo "github-pages visible on the artifact service after $((i * 3))s"
                  exit 0
                fi
                echo "attempt $i: artifact service reports ${n:-no-response} github-pages artifact(s)"
                sleep 3
              done
              echo "::warning::artifact service did not list github-pages within 120s; still trying to deploy"
              exit 0
            fi
          fi
          echo "artifact service is not reachable from this step; falling back to REST visibility + settle delay"
          for i in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
                 | grep -q .; then
              echo "github-pages visible via REST after $((i * 3))s"
              break
            fi
            sleep 3
          done
          # REST 可见 ≠ artifact service 索引已跟上，这里再留 90 秒沉降余量
          # （实测需要的滞后约 6.5 秒，90 秒约为其 13 倍）。
          echo "settling 90s so the artifact service index can catch up"
          sleep 90

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Settle before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Resolve page URL
        id: resolve_page_url
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then url="${{ steps.deployment_retry.outputs.page_url }}"; fi
          echo "page_url=$url" >> "$GITHUB_OUTPUT"

      - name: Assert deployment
        run: |
          if [ -z "${{ steps.resolve_page_url.outputs.page_url }}" ]; then
            echo "::error::Pages deployment produced no page_url; the live site is NOT updated"
            exit 1
          fi
          echo "deployed to ${{ steps.resolve_page_url.outputs.page_url }}"
