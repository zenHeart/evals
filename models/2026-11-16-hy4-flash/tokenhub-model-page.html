  <!-- 公共样式：业务依赖 global.css，不加版本号/max_age 后缀；需放在页面样式之前 -->
  <link rel="stylesheet"
    href="https://cloudcache.tencent-cloud.com/open_proj/proj_qcloud_v2/gateway/portal/css/global.css" />
  <style>
    :root {
      --text-primary: rgba(0, 0, 0, 0.9);
      --text-secondary: rgba(0, 0, 0, 0.7);
      --text-tertiary: rgba(0, 0, 0, 0.5);
      --text-disabled: rgba(0, 0, 0, 0.3);
      --brand: #0052d9;
      --brand-hover: #266fe8;
      --brand-btn: #005bf0;
      --brand-light: #e3ecff;
      --brand-on-light: #0034b5;
      --success-light: #e7f8f0;
      --success-on-light: #088f50;
      --border: #e6e9ef;
      --border-secondary: #e9ecf1;
      --row-border: rgba(230, 233, 239, 0.64);
      --bg-hover: #f7f8fb;
      --table-head: rgba(242, 244, 248, 0.64);
      --font:
        "PingFang SC", "SF Pro Text", -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
      --content-width: 1200px;
    }

    html,
    body {
      background: #fff;
    }

    /* 基础样式仅作用于业务区域，避免影响公共导航/底部 */
    .page-body,
    .page-body *,
    .toast {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .page-body,
    .toast {
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 12px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .page-body a {
      color: var(--brand);
      text-decoration: none;
      cursor: pointer;
    }

    .page-body a:hover {
      color: var(--brand-hover);
    }

    .page-body img {
      display: block;
    }

    .page-body button {
      font-family: inherit;
    }

    /* ============ 页面主体 ============ */
    .page-body {
      position: relative;
      overflow: hidden;
      padding: 32px 20px 64px;
    }

    .page-body__light {
      position: absolute;
      top: -84px;
      right: 40px;
      width: 640px;
      height: 120px;
      opacity: 0.36;
      background: linear-gradient(90deg,
          #acf7ec 0%,
          #5fb9f8 36%,
          #b2ecff 64%,
          #acf7ec 100%);
      border-radius: 9999px;
      filter: blur(100px);
      pointer-events: none;
    }

    .container {
      position: relative;
      max-width: var(--content-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* ============ 模型头部 ============ */
    .model-header {
      display: flex;
      gap: 20px;
    }

    .model-header__logo {
      flex: none;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--border-secondary);
      border-radius: 12px;
    }

    .model-header__logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .model-header__main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-header__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
    }

    .model-header__name-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      min-width: 0;
    }

    .model-header__name {
      font-family: "SF Pro Text", var(--font);
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border-radius: 4px;
      white-space: nowrap;
    }

    .model-header__actions {
      flex: none;
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 20px;
      font-size: 12px;
      color: #000;
      background: #fff;
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition:
        background 0.2s,
        border-color 0.2s;
    }

    /* 提升优先级，避免被 .page-body a 的颜色覆盖 */
    .page-body .btn {
      color: #000;
    }

    .page-body .btn:hover {
      color: #000;
      background: var(--bg-hover);
    }

    .page-body .btn--primary {
      color: rgba(255, 255, 255, 0.9);
      background: var(--brand-btn);
      border-color: var(--brand-btn);
    }

    .page-body .btn--primary:hover {
      color: #fff;
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }

    .model-header__id {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      line-height: 20px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0.9;
    }

    .icon-btn:hover {
      opacity: 1;
    }

    /* ============ 区块通用 ============ */
    .section__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 24px;
      margin-bottom: 12px;
    }

    .section__title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .section__title {
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      white-space: nowrap;
    }

    .section__divider {
      flex: none;
      width: 1px;
      height: 16px;
      background: var(--border);
    }

    .section__subtitle {
      color: var(--text-tertiary);
    }

    .section__desc {
      color: var(--text-secondary);
      line-height: 24px;
      text-align: justify;
    }

    /* 两列 KV 网格（价格 / 能力 / 输入输出 / 限制 / 协议） */
    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 120px;
    }

    .kv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 48px;
      border-bottom: 1px solid var(--row-border);
    }

    .kv-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text-secondary);
    }

    .kv-value {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .kv-value b {
      font-family: "SF Pro Text", var(--font);
      font-size: 14px;
      font-weight: 600;
    }

    .kv-value del {
      margin-right: 4px;
      color: var(--text-tertiary);
      text-decoration-color: var(--text-tertiary);
    }

    .kv-texts {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .kv-texts__divider {
      width: 1px;
      height: 12px;
      background: var(--border);
    }

    .kv-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--text-primary);
    }

    .kv-copy {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .kv-copy:hover {
      color: var(--brand);
    }

    /* 折扣标签 */
    .discount-tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 500;
      border: 0.6px solid transparent;
      border-radius: 2px;
      background:
        linear-gradient(90deg,
          rgba(255, 120, 0, 0.08) 36%,
          rgba(255, 167, 96, 0.08) 100%) padding-box,
        linear-gradient(#fff, #fff) padding-box,
        linear-gradient(90deg, #ff7800 36%, #fac235 100%) border-box;
    }

    .discount-tag span {
      background: linear-gradient(180deg, #ffa760 0%, #ff7800 64%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .capsule {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 12px;
    }

    .capsule--blue {
      color: var(--brand-on-light);
      background: var(--brand-light);
    }

    /* Toast（层级高于公共顶部导航） */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 10000;
      padding: 8px 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      transform: translate(-50%, -8px);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .toast.is-show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ============ 响应式 ============ */
    @media (max-width: 1024px) {
      .kv-grid {
        column-gap: 48px;
      }
    }

    @media (max-width: 768px) {
      .page-body {
        padding: 24px 16px 48px;
      }

      .container {
        gap: 32px;
      }

      .model-header__row {
        flex-direction: column;
        align-items: flex-start;
      }

      .model-header__actions {
        flex-wrap: wrap;
      }

      .kv-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .kv-item--placeholder {
        display: none;
      }

      .section__head {
        flex-wrap: wrap;
      }

      .section__title-wrap {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

      },
      {
        key: "contextLength",
        label: "上下文窗口",
        modelTypes: ["Text", "Multimodal", "Embedding"],
      },
      {
        key: "tpm",
        label: "最大 TPM",
        modelTypes: ["Text", "Multimodal", "Embedding"],
      },
      {
        key: "qpm",
        label: "最大 RPM",
        modelTypes: ["Text", "Multimodal", "Embedding"],
      },
      { key: "concurrency", label: "默认并发数" },
    ];
    const PROTOCOL_ITEMS = [
      { key: "CompletionsAPI", label: "Chat Completions", showPath: true },
      { key: "ResponsesAPI", label: "Responses", showPath: true },
      {
        key: "EmbeddingsMultimodalAPI",
        label: "Embeddings Multimodal API",
        showPath: true,
      },
      { key: "EmbeddingsAPI", label: "Embeddings API", showPath: true },
      { key: "OpenAPI", label: "OpenAPI", showPath: false },
      { key: "AnthropicAPI", label: "Anthropic", showPath: true },
    ];

    /* ==================== 工具函数 ==================== */
    const $ = (id) => document.getElementById(id);

    /** 创建元素（文本统一使用 textContent，避免 XSS） */
    const h = (tag, attrs = {}, children = []) => {
      const el = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.startsWith("on"))
          el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v);
      });
      []
        .concat(children)
        .filter(Boolean)
        .forEach((c) => el.append(c));
      return el;
    };

    const icon = (file, size = 16, alt = "") =>
      h("img", { src: ASSET + file, width: size, height: size, alt });

    /** 勾选图标（check-circle） */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const CHECK_CIRCLE_PATH =
      "M8.00016 14C11.3139 14 14.0002 11.3137 14.0002 8.00004C14.0002 4.68633 11.3139 2.00004 8.00016 2.00004C4.68646 2.00004 2.00016 4.68633 2.00016 8.00004C2.00016 11.3137 4.68645 14 8.00016 14ZM15.3335 8.00004C15.3335 12.0501 12.0503 15.3334 8.00016 15.3334C3.95008 15.3334 0.66683 12.0501 0.666831 8.00004C0.666831 3.94995 3.95008 0.666707 8.00016 0.666707C12.0503 0.666708 15.3335 3.94995 15.3335 8.00004ZM7.3335 10.6095L4.72402 8.00004L5.66683 7.05723L7.3335 8.7239L10.6668 5.39057L11.6096 6.33337L7.3335 10.6095Z";
    const checkIcon = () => {
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("class", "ruyi-icon ruyi-icon-check-circle");
      svg.setAttribute("width", "16");
      svg.setAttribute("height", "16");
      svg.setAttribute("viewBox", "0 0 16 16");
      svg.setAttribute("fill", "none");
      svg.setAttribute("aria-label", "支持");
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", CHECK_CIRCLE_PATH);
      path.setAttribute("fill", "currentColor");
      path.setAttribute("fill-rule", "evenodd");
      path.setAttribute("clip-rule", "evenodd");
      path.setAttribute("fill-opacity", "0.9");
      svg.append(path);
      return h("span", { className: "kv-check" }, svg);
    };

    let toastTimer;
    const showToast = (msg) => {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("is-show"), 1600);
    };

    const copyText = async (text) => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = h("textarea", {
            style: "position:fixed;left:-9999px;top:-9999px",
          });
          ta.value = text;
          document.body.append(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        showToast("复制成功");
      } catch (e) {
        showToast("复制失败");
      }
    };

    /** 按每行 2 个分组渲染 KV 网格，奇数时补占位 */
    const renderGrid = (container, items) => {
      container.replaceChildren(...items);
      if (items.length % 2 === 1) {
        container.append(
          h("div", {
            className: "kv-item kv-item--placeholder",
            style: "visibility:hidden",
          }),
        );
      }
    };

    const kvItem = (labelChildren, valueChildren, valueClass = "kv-value") =>
      h("div", { className: "kv-item" }, [
        h("span", { className: "kv-label" }, labelChildren),
        h("span", { className: valueClass }, valueChildren),
      ]);

    const extractPaths = (curl) => [
      ...new Set(curl?.match(/\/v1\/[^\s'"\\]+/g) || []),
    ];

    const formatDiscount = (rate) =>
      `限时 ${Number((rate * 10).toFixed(1))} 折`;

    /* ==================== 渲染 ==================== */
    const info = MODEL_INFO;
    const isTextModel = ["Text", "MultiModal"].includes(info.modelType);

    // 头部
    const renderHeader = () => {
      document.title = `${info.displayName} - 模型详情`;
      $("modelName").textContent = info.displayName;
      $("modelId").textContent = info.modelId;
      $("modelLogo").append(
        info.modelImage?.url
          ? h("img", { src: info.modelImage.url, alt: info.displayName })
          : h("span", { text: info.displayName?.slice(0, 2) || "M" }),
      );
      $("modelTags").replaceChildren(
        ...(info.tags || []).map((tag) =>
          h("span", { className: "tag", text: tag }),
        ),
      );
      $("copyModelId").addEventListener("click", () =>
        copyText(info.modelId),
      );

      const exp = $("btnExperience");
      if (info.disabledExperience) {
        exp.setAttribute("aria-disabled", "true");
        exp.title = "该模型不支持体验";
        exp.style.opacity = "0.4";
        exp.style.pointerEvents = "none";
      } else {
        exp.href =
          "https://console.cloud.tencent.com/tokenhub/models/detail?modelId=hy4-flash&regionId=1&from=featured";
      }
      $("btnDiff").href =
        "https://console.cloud.tencent.com/tokenhub/models/diff?models=hy4-flash,hy4&regionId=1&from=featured";
    };

    // 模型介绍
    const renderIntro = () => {
      if (!info.description) {
        $("sectionIntro").remove();
        return;
      }
      $("modelDesc").textContent = info.description;
    };

    // 模型价格
    const renderPrice = () => {
      const chargingInfo = info.modelChargingInfo || [];
      const current = chargingInfo[0];
      const items = (current?.chargingItems || []).filter(
        (item) => !!item?.priceName,
      );
      const hasTokenPriceGuide = items.some(
        (item) => item.priceName === "Token",
      );

      if (chargingInfo.length > 1) {
        $("priceTitle").append(
          h("span", { className: "capsule capsule--blue", text: "阶梯计价" }),
        );
      }
      if (hasTokenPriceGuide) {
        $("priceTitle").append(
          h("span", { className: "section__divider" }),
          h("span", {
            className: "section__subtitle",
            text: "费用 = Token 单价 * Token 用量",
          }),
        );
      }

      renderGrid(
        $("priceGrid"),
        items.map((item) => {
          const label = [h("span", { text: item.displayName })];
          if (item.discountPrice) {
            label.push(
              h(
                "span",
                { className: "discount-tag" },
                h("span", { text: formatDiscount(item.discountRate) }),
              ),
            );
          }
          const value = item.discountPrice
            ? [
              h("del", { text: item.price }),
              h("b", { text: item.discountPrice }),
              h("span", { text: item.priceUnit }),
            ]
            : [
              h("b", { text: item.price }),
              h("span", { text: item.priceUnit }),
            ];
          return kvItem(label, value);
        }),
      );
    };

    // 模型能力
    const renderAbility = () => {
      if (!isTextModel) {
        $("sectionAbility").remove();
        return;
      }
      const abilities = ABILITY_FILTER.map((name) =>
        info.modelCapabilities.find((c) => c.name === name),
      ).filter(Boolean);
      renderGrid(
        $("abilityGrid"),
        abilities.map((a) =>
          kvItem(
            h("span", { text: a.displayName }),
            a.value === "true" ? checkIcon() : null,
          ),
        ),
      );
    };

    // 输入输出类型
    const renderInOut = () => {
      const build = (label, filter) => {
        const list = info.modelCapabilities.filter((c) =>
          filter.includes(c.name),
        );
        const texts = [];
        list.forEach((c, index) => {
          if (index > 0)
            texts.push(h("span", { className: "kv-texts__divider" }));
          texts.push(
            h("span", {
              text: IN_OUTPUT_SHORT_NAME_MAP[c.name] || c.displayName,
            }),
          );
        });
        return kvItem(h("span", { text: label }), texts, "kv-texts");
      };
      const items = [
        build("输入类型", INPUT_ABILITY_FILTER),
        build("输出类型", OUTPUT_ABILITY_FILTER),
      ];
      const desc = info.modelSpecSet?.inputDescription;
      if (desc) {
        items.push(
          kvItem(
            h("span", { text: "输入描述" }),
            h("span", { text: desc, title: desc }),
          ),
        );
      }
      renderGrid($("inOutGrid"), items);
    };

    // 模型限制
    const renderLimit = () => {
      const limits = LIMIT_FIELD_CONFIGS.filter(
        (c) => !c.modelTypes || c.modelTypes.includes(info.modelType),
      )
        .map((c) => ({
          name: c.label,
          value: info.modelSpecSet?.[c.key] || "-",
        }))
        .filter((item) => item.value !== "-");
      renderGrid(
        $("limitGrid"),
        limits.map((l) =>
          kvItem(h("span", { text: l.name }), h("b", { text: l.value })),
        ),
      );
    };

    // 调用协议
    const renderProtocol = () => {
      const supported = PROTOCOL_ITEMS.map((item) => {
        const cap = info.modelCapabilities.find((c) => c.name === item.key);
        if (!cap?.value) return null;
        return {
          ...item,
          paths: item.showPath ? extractPaths(cap.value) : [],
        };
      }).filter(Boolean);

      if (!supported.length) {
        $("sectionProtocol").remove();
        return;
      }
      renderGrid(
        $("protocolGrid"),
        supported.map((item) => {
          if (item.showPath && item.paths.length) {
            const text = item.paths.join(", ");
            const value = h(
              "span",
              {
                className: "kv-copy",
                title: "点击复制",
                onClick: () => copyText(text),
              },
              [h("span", { text }), checkIcon("3.svg", 16, "复制")],
            );
            return kvItem(h("span", { text: item.label }), value);
          }
          return kvItem(h("span", { text: item.label }), checkIcon());
        }),
      );
    };

    renderHeader();
    renderIntro();
    renderPrice();
    renderAbility();
    renderInOut();
    renderLimit();
    renderProtocol();
  </script>

  <!-- 初始化公共顶部导航与底部 -->
  <script>
    if (window.QCPortalKit) {
      window.QCPortalKit.init({
        topNav: { theme: "default" },
        footer: { theme: "default" },
      });
    }
  </script>
</body>

</html>
