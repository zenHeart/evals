<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <ellipse cx="600" cy="600" rx="700" ry="500" fill="url(#glow)"/>

  <!-- Grid lines (eval = measurement) -->
  <g stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="900" x2="1200" y2="900"/>
    <line x1="0" y1="1200" x2="1200" y2="1200"/>
    <line x1="0" y1="1500" x2="1200" y2="1500"/>
    <line x1="200" y1="0" x2="200" y2="1800"/>
    <line x1="400" y1="0" x2="400" y2="1800"/>
    <line x1="600" y1="0" x2="600" y2="1800"/>
    <line x1="800" y1="0" x2="800" y2="1800"/>
    <line x1="1000" y1="0" x2="1000" y2="1800"/>
  </g>

  <!-- Scale ticks (think bar chart) -->
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <line x1="280" y1="1300" x2="280" y2="1100"/>
    <line x1="400" y1="1300" x2="400" y2="950"/>
    <line x1="520" y1="1300" x2="520" y2="800"/>
    <line x1="640" y1="1300" x2="640" y2="700"/>
    <line x1="760" y1="1300" x2="760" y2="850"/>
    <line x1="880" y1="1300" x2="880" y2="1020"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">
    <text x="280" y="1340">MMLU</text>
    <text x="400" y="1340">GSM8K</text>
    <text x="520" y="1340">HumanEval</text>
    <text x="640" y="1340">Arena</text>
    <text x="760" y="1340">SWE-bench</text>
    <text x="880" y="1340">MATH</text>
  </g>
  <line x1="240" y1="1300" x2="920" y2="1300" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Big title -->
  <g font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#f8fafc">
    <text x="100" y="380" font-size="48" font-weight="700" fill="#22d3ee" letter-spacing="6">EVAL · HANDBOOK</text>
    <text x="100" y="510" font-size="120" font-weight="800">大模型评估</text>
    <text x="100" y="640" font-size="120" font-weight="800">入门</text>
  </g>

  <!-- Subtitle -->
  <g font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#cbd5e1">
    <text x="100" y="730" font-size="40" font-weight="500">从前端工程师视角看 Eval</text>
    <text x="100" y="790" font-size="28" font-weight="400" fill="#94a3b8">理解厂商报告 · 选对基准 · 搭建自己的评估流水线</text>
  </g>

  <!-- Accent bar -->
  <rect x="100" y="850" width="240" height="6" fill="url(#accent)"/>

  <!-- Tag chips -->
  <g font-family="ui-sans-serif, sans-serif" font-size="22" fill="#0f172a">
    <g transform="translate(100,920)">
      <rect width="170" height="44" rx="22" fill="#22d3ee"/>
      <text x="85" y="30" text-anchor="middle" font-weight="700">MMLU</text>
    </g>
    <g transform="translate(290,920)">
      <rect width="170" height="44" rx="22" fill="#60a5fa"/>
      <text x="85" y="30" text-anchor="middle" font-weight="700">GSM8K</text>
    </g>
    <g transform="translate(480,920)">
      <rect width="200" height="44" rx="22" fill="#a78bfa"/>
      <text x="100" y="30" text-anchor="middle" font-weight="700">HumanEval</text>
    </g>
    <g transform="translate(700,920)">
      <rect width="200" height="44" rx="22" fill="#f472b6"/>
      <text x="100" y="30" text-anchor="middle" font-weight="700">SWE-bench</text>
    </g>
  </g>

  <!-- Bottom author/date -->
  <g font-family="ui-sans-serif, -apple-system, 'PingFang SC', sans-serif" fill="#94a3b8">
    <text x="100" y="1620" font-size="28" font-weight="600">ZenHeart</text>
    <text x="100" y="1660" font-size="22">v2.0 · 2026</text>
  </g>

  <!-- Big version / chapter count（章数/部分数必须与 book/metadata.yaml 一致，validate-site.mjs 会校验） -->
  <g font-family="ui-sans-serif, sans-serif" fill="#cbd5e1" text-anchor="end">
    <text x="1100" y="1620" font-size="36" font-weight="800" fill="url(#accent)">32 章</text>
    <text x="1100" y="1660" font-size="22" fill="#94a3b8">5 个部分</text>
  </g>

  <!-- URL / domain -->
  <g font-family="ui-monospace, monospace" fill="#64748b">
    <text x="1100" y="1730" font-size="22" text-anchor="end">evals.zenheart.site</text>
  </g>
</svg>
